<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>local research</title>
<style>
  :root{
    --bg:#f7f7f6; --panel:#ffffff; --ink:#1c1c1a; --dim:#6b6b66; --line:#e4e4e0;
    --accent:#2f6f4f; --accent-ink:#fff; --chip:#eef2f0; --link:#1e6f8c; --warn:#9a6b1a;
    --stop:#a03535; --stop-ink:#fff;
    --user:#eef3f7;
    --qmin:44px;   /* one row at rest — the JS autosize floor matches it exactly */
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17181a; --panel:#1f2124; --ink:#e9e9e6; --dim:#9a9a94; --line:#31343a;
      --accent:#4a9d74; --accent-ink:#0c0f0d; --chip:#26292e; --link:#6fc0dc; --warn:#d0a24f;
      --stop:#d16a6a; --stop-ink:#160c0c;
      --user:#232a31;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;
       display:flex;flex-direction:column}
  header{display:flex;gap:10px;align-items:center;padding:10px 14px;
         border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  header .title{font-weight:600;margin-right:auto}
  header .title small{color:var(--dim);font-weight:400}
  select,button{font:inherit;color:var(--ink);background:var(--panel);
                border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  #convo{flex:1;overflow-y:auto;padding:20px 0}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px}
  .turn{margin:0 0 26px}
  .user{background:var(--user);border:1px solid var(--line);border-radius:12px;
        padding:10px 14px;white-space:pre-wrap;word-wrap:break-word;position:relative}
  .user .edit{position:absolute;top:5px;right:5px;opacity:0;transition:opacity .12s;
        background:var(--user);border:1px solid var(--line);color:var(--dim);
        border-radius:6px;padding:1px 7px;font-size:12px;cursor:pointer}
  .user:hover .edit,.user .edit:focus{opacity:1}
  .user .edit:hover{color:var(--ink);border-color:var(--dim)}
  details.trace{margin:10px 0 0;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  details.trace>summary{cursor:pointer;padding:8px 12px;color:var(--ink);font-size:13px;
        list-style:none;display:flex;gap:8px;align-items:center}
  details.trace>summary::-webkit-details-marker{display:none}
  details.trace>summary .spin{display:inline-block}
  .tracebody{padding:6px 12px 12px;font-size:13px;color:var(--ink);
        border-top:1px solid var(--line)}
  .step{margin-top:8px}
  .steplabel{color:var(--dim);font-weight:600;font-size:12px;letter-spacing:.03em}
  .think{white-space:pre-wrap;margin:2px 0 0}
  .chip{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 7px;margin:3px 4px 0 0;
        font-size:12px}
  .chip.tool{color:var(--accent)}
  .chip.warn{color:var(--warn)}
  .chip.err{color:#c0392b}
  .src a{color:var(--link);text-decoration:none;word-break:break-all}
  .src a:hover{text-decoration:underline}
  .answer{margin-top:12px}
  .answer h1,.answer h2,.answer h3{font-size:1.05em;margin:1em 0 .3em}
  .answer p{margin:.5em 0}
  .answer ul,.answer ol{margin:.4em 0 .4em 1.3em;padding:0}
  .answer code{background:var(--chip);padding:1px 5px;border-radius:5px;font-size:.9em}
  .answer pre{background:var(--chip);padding:10px;border-radius:8px;overflow-x:auto}
  .answer a{color:var(--link)}
  .answer table{border-collapse:collapse;margin:.7em 0;width:100%;font-size:.95em;
        display:block;overflow-x:auto}
  .answer th,.answer td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
  .answer thead th{background:var(--chip)}
  .answerbar{margin-top:6px}
  .answerbar button{padding:3px 9px;font-size:12px}
  .stream{white-space:pre-wrap}
  .draft{margin-top:8px;opacity:.72}
  .draft .steplabel{color:var(--warn)}
  footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 0}
  .composer{display:flex;gap:8px;align-items:flex-end}
  /* Intelligence selector: three cups, water level = how hard the model thinks.
     Click a cup; the chosen one holds coloured water (slate / blue / violet), the
     others stay ghosted at their levels so the whole scale is visible at once.
     Sits beside Send, so the level is set where the question is written. */
  /* Three cups; the water level is how hard the model thinks. No labels — the shape
     carries the meaning, and hovering names the level. */
  .effortpick{display:flex;align-items:center;gap:8px;--lvl:var(--dim)}
  /* The word rides the bottom rim of the cups box like a fieldset legend — half
     above the line, half below. Panel background so it interrupts the border
     cleanly, and it takes the chosen level's colour. */
  .effortword{position:absolute;left:50%;bottom:0;transform:translate(-50%,50%);
              background:var(--panel);padding:0 6px;
              color:var(--lvl);font-size:12px;font-weight:600;white-space:nowrap;
              transition:color .2s}
  .effortpick[data-level="low"]   {--lvl:#7f93a8}   /* slate — quick sip          */
  .effortpick[data-level="medium"]{--lvl:#4ea1ff}   /* blue  — the everyday glass */
  /* Orange, not another cool tone: low and medium already ramp slate -> blue, so a
     warm top step reads as heat rather than just "more blue", and it can't be
     mistaken for the everyday level at a glance. */
  .effortpick[data-level="high"]  {--lvl:#ff8b30}   /* orange — filled to the brim */
  /* Fills its parent's height, so the footer reads as one block rather than a row of
     floating widgets. Tight padding keeps the cups themselves tall inside it. */
  /* The negative bottom margin lets the cups reach down past the composer, level with
     the hint line, so they get real height without making the input taller. */
  .cups{position:relative;display:flex;align-items:flex-end;gap:7px;padding:6px 9px 10px;
        background:var(--panel);
        border:1px solid var(--line);border-radius:12px;margin-bottom:-21px}
  .cup{position:relative;width:24px;height:63px;padding:0;cursor:pointer;
       background:var(--bg);border:1px solid var(--line);border-radius:3px 3px 9px 9px;
       overflow:hidden;transition:border-color .2s,box-shadow .2s,transform .12s}
  .cup:hover{transform:translateY(-2px)}
  .cup .water{position:absolute;left:0;right:0;bottom:0;background:var(--line);
              transition:height .3s cubic-bezier(.3,1.4,.5,1),background .2s}
  .cup .water::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;
                     background:rgba(255,255,255,.22)}   /* the water's surface */
  .cup[data-level="low"]    .water{height:32%}
  .cup[data-level="medium"] .water{height:62%}
  .cup[data-level="high"]   .water{height:94%}
  /* the chosen cup: coloured water, lit rim, and the label takes the colour too */
  .effortpick[data-level="low"]    .cup[data-level="low"],
  .effortpick[data-level="medium"] .cup[data-level="medium"],
  .effortpick[data-level="high"]   .cup[data-level="high"]{
    border-color:var(--lvl);
    box-shadow:0 0 7px color-mix(in srgb, var(--lvl) 55%, transparent)}
  .effortpick[data-level="low"]    .cup[data-level="low"] .water,
  .effortpick[data-level="medium"] .cup[data-level="medium"] .water,
  .effortpick[data-level="high"]   .cup[data-level="high"] .water{
    background:linear-gradient(to top,
      var(--lvl), color-mix(in srgb, var(--lvl) 72%, white))}
  /* One row at rest. It used to OPEN at the browser's natural two-row height and then
     snap down to one row on the first keystroke, because autosize reset it to 44px.
     The height was never the problem — the disagreement was. CSS and JS now share
     --qmin, so it opens at one row and stays there until the text needs more. */
  textarea{flex:1;resize:none;min-height:var(--qmin);max-height:180px;font:inherit;color:var(--ink);
           background:var(--bg);border:1px solid var(--line);border-radius:10px;
           padding:10px 48px 10px 12px}   /* right padding clears the send button */
  /* The browser's default focus ring follows the OS accent colour, which painted the
     box a loud red/amber. Replace it with a quiet grey rim — still an obvious focus
     cue, but it stops the composer shouting while you type. */
  textarea:focus{outline:none;border-color:var(--dim)}
  /* The send button lives INSIDE the prompt box, pinned to its bottom-right corner
     (it stays put while the box grows), the way chat apps put the arrow in the field.
     No background disc — the bare sign carries the state through its colour alone. */
  .qwrap{position:relative;flex:1;display:flex}
  #send{position:absolute;right:7px;bottom:6px;width:32px;height:32px;padding:0;
        background:none;border:none;color:var(--accent);font-size:19px;line-height:1;
        display:flex;align-items:center;justify-content:center}
  /* The stop sign is drawn, not typed: a font glyph sits on its baseline, which parks
     it low in the button no matter how the box is centred. An empty bordered box is
     centred by the flex rules above, and being a border it can't read as "filled". */
  #send.stopping{color:var(--stop)}
  #send.stopping::before{content:"";width:13px;height:13px;
                         border:2px solid currentColor;border-radius:3px}
  .hint{color:var(--dim);font-size:12px;margin-top:6px;text-align:center}
  /* confirm sheet — used when switching models trades one model's RAM for another's */
  .modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
         background:rgba(0,0,0,.45);padding:20px}
  .modal[hidden]{display:none}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;
         padding:18px 20px;max-width:460px;width:100%;box-shadow:0 14px 44px rgba(0,0,0,.4)}
  .sheet h3{margin:0 0 10px;font-size:16px}
  .sheet p{margin:0 0 8px;color:var(--dim);font-size:14px;line-height:1.55}
  .sheet .name{color:var(--ink);font-weight:600;word-break:break-all}
  .modalbar{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
</style>
</head>
<body>
  <header>
    <span class="title">local research <small>· web-capable local LLM</small></span>
    <label><small style="color:var(--dim)">model</small></label>
    <select id="model"></select>
    <button id="sayhi" title="Warm up the selected model so it's ready — no need to type hi">Say Hi!</button>
    <button id="deactivate" title="Unload the selected model from RAM to free memory">Deactivate</button>
    <button id="newchat">New chat</button>
  </header>

  <div id="convo"><div class="wrap" id="turns"></div></div>

  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modaltitle">
      <h3 id="modaltitle">Switch model?</h3>
      <div id="modaltext"></div>
      <div class="modalbar">
        <button id="modalcancel">Cancel</button>
        <button id="modalok" class="primary">OK</button>
      </div>
    </div>
  </div>

  <footer><div class="wrap">
    <div class="composer">
      <!-- rows=1: without it the browser opens the box at its default TWO rows, which
           min-height can't shrink, and the first keystroke snapped it down to one. -->
      <div class="qwrap">
        <textarea id="q" rows="1" placeholder="Ask anything — parentheses, quotes, symbols all fine here."></textarea>
        <button id="send" title="Send — or press Enter">⏎</button>
      </div>
      <div class="effortpick" data-level="medium">
        <!-- A hidden input carries the value so ask() keeps reading #effort as before.
             autocomplete=off so a reload can't resurrect a stale pick over the default. -->
        <input type="hidden" id="effort" value="medium" autocomplete="off">
        <div class="cups" role="radiogroup" aria-label="intelligence">
          <button type="button" class="cup" data-level="low"
                  title="low — quick, snappy answers" aria-label="low intelligence"><span class="water"></span></button>
          <button type="button" class="cup" data-level="medium"
                  title="medium — the everyday level (default)" aria-label="medium intelligence"><span class="water"></span></button>
          <button type="button" class="cup" data-level="high"
                  title="high — thinks long and hard before answering" aria-label="high intelligence"><span class="water"></span></button>
          <small class="effortword">capacity</small>
        </div>
      </div>
    </div>
    <div class="hint" id="hint">Enter to send · Shift+Enter for a new line · everything runs locally</div>
  </div></footer>

<script>
const $ = s => document.querySelector(s);
const turns = $("#turns"), convo = $("#convo");
let controller = null, liveQuestion = null;

// ---- the conversation, kept in localStorage ----
// Without this the TAB is the conversation: sid was regenerated on every page load,
// so a reload — or pasting the URL into a second tab — opened a blank page while the
// real session sat unreachable in the server's memory. Keeping sid + finished turns
// here lets any tab pick the thread back up. Deliberately client-side: a new tab has
// to learn the sid from somewhere anyway, and a server "read my history" route would
// be a second way to pull conversations back out over HTTP, which history.py's whole
// posture is built to avoid.
const SKEY = "research.session";
const KEEP_TURNS = 8;          // mirrors the server's RESEARCH_MAX_HISTORY_TURNS
function loadStore(){
  try{
    const s = JSON.parse(localStorage.getItem(SKEY));
    if(s && typeof s.sid === "string" && Array.isArray(s.turns)) return s;
  }catch(e){}                  // unparseable/absent: start fresh rather than break
  return null;
}
function saveStore(){ try{ localStorage.setItem(SKEY, JSON.stringify(store)); }catch(e){} }
let store = loadStore() || {sid: crypto.randomUUID(), turns: []};
let sid = store.sid;
saveStore();
function rememberTurn(q, a){
  store.turns.push({q, a});
  if(store.turns.length > KEEP_TURNS) store.turns = store.turns.slice(-KEEP_TURNS);
  saveStore();
}

// ---- minimal, dependency-free markdown -> safe HTML ----
// Quotes must be escaped too: inline() builds href="..." attributes out of this
// text, and an unescaped " in a model-written URL would break out of the
// attribute and become live script (the URLs come from fetched web pages).
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");   // italics, after bold
  s = s.replace(/(https?:\/\/[^\s<)\]]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  return s;
}
function markdown(text){
  const lines = text.split("\n"); let html="", list=null, i=0;
  const closeList=()=>{ if(list){ html+=`</${list}>`; list=null; } };
  const isSep = s => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(s);
  const cells = s => s.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(x=>x.trim());
  while(i < lines.length){
    const line = lines[i].replace(/\s+$/,"");
    // GFM table: a header row of pipes followed by a |---|---| separator
    if(line.includes("|") && i+1 < lines.length && isSep(lines[i+1])){
      closeList();
      html += "<table><thead><tr>" + cells(line).map(h=>`<th>${inline(h)}</th>`).join("") + "</tr></thead><tbody>";
      i += 2;
      while(i < lines.length && lines[i].includes("|") && lines[i].trim() !== ""){
        html += "<tr>" + cells(lines[i]).map(c=>`<td>${inline(c)}</td>`).join("") + "</tr>";
        i++;
      }
      html += "</tbody></table>"; continue;
    }
    let m;
    if((m=line.match(/^(#{1,3})\s+(.*)$/))){ closeList(); const n=m[1].length; html+=`<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if((m=line.match(/^\s*[-*]\s+(.*)$/))){ if(list!=="ul"){closeList();list="ul";html+="<ul>";} html+=`<li>${inline(m[1])}</li>`; i++; continue; }
    if((m=line.match(/^\s*\d+[.)]\s+(.*)$/))){ if(list!=="ol"){closeList();list="ol";html+="<ol>";} html+=`<li>${inline(m[1])}</li>`; i++; continue; }
    if(line.trim()===""){ closeList(); i++; continue; }
    closeList(); html+=`<p>${inline(line)}</p>`; i++;
  }
  closeList(); return html;
}

// ---- models ----
let currentModel = null;   // what is actually loaded/selected, so a cancelled switch can revert
async function loadModels(){
  try{
    const r = await fetch("/api/models"); const d = await r.json();
    const sel = $("#model"); sel.innerHTML="";
    (d.models||[]).forEach(name=>{
      const o=document.createElement("option"); o.value=o.textContent=name;
      if(name===d.default) o.selected=true; sel.appendChild(o);
    });
    if(!d.models || !d.models.length){ const o=document.createElement("option"); o.textContent="(no models)"; sel.appendChild(o); }
    currentModel = sel.value;   // the baseline a switch is measured against
  }catch(e){ /* offline is fine; server will error clearly on send */ }
}

// Follow the stream only while the user is parked at the bottom. As soon as they scroll
// up to read something mid-generation, stop yanking the view down; scrolling back to the
// bottom resumes following.
let stick = true, lastTop = 0;
convo.addEventListener("scroll", () => {
  const top = convo.scrollTop;
  const atBottom = top + convo.clientHeight >= convo.scrollHeight - 80;
  // Direction, not just position: the moment the user pushes the view UP we let
  // go and stop following, even if still near the bottom. We only re-follow once
  // they've come back down to the bottom. Programmatic scrolls only ever move
  // DOWN, so they can never trip the "user scrolled up" branch and yank the view.
  if(top < lastTop - 2) stick = false;
  else if(atBottom) stick = true;
  lastTop = top;
});
function scrollDown(){ if(stick){ convo.scrollTop = convo.scrollHeight; lastTop = convo.scrollTop; } }
function stickToBottom(){ stick = true; convo.scrollTop = convo.scrollHeight; lastTop = convo.scrollTop; }

function addCopyBar(ansEl, text){
  const bar=document.createElement("div"); bar.className="answerbar";
  const b=document.createElement("button"); b.textContent="Copy";
  b.onclick=()=>{ navigator.clipboard.writeText(text); b.textContent="Copied ✓";
                  setTimeout(()=>b.textContent="Copy",1200); };
  bar.appendChild(b); ansEl.appendChild(bar);
}

// A turn replayed from localStorage: question + answer, no trace. The reasoning
// steps are deliberately not stored — the server discards that bulk after each turn
// too (commit_turn), so what the page shows matches what the model still remembers.
function renderSaved(q, a){
  const t=document.createElement("div"); t.className="turn";
  const u=document.createElement("div"); u.className="user"; u.textContent=q;
  const ed=document.createElement("button"); ed.className="edit"; ed.textContent="✎ edit";
  ed.title="Put this question back in the box to reword and ask again";
  ed.onclick=()=>reAsk(q);
  u.appendChild(ed);
  const ans=document.createElement("div"); ans.className="answer";
  ans.innerHTML=markdown(a); addCopyBar(ans, a);
  t.appendChild(u); t.appendChild(ans); turns.appendChild(t);
}

// ---- one Q/A turn ----
function newTurn(question){
  const t = document.createElement("div"); t.className="turn";
  const u = document.createElement("div"); u.className="user"; u.textContent=question;
  const ed = document.createElement("button"); ed.className="edit"; ed.textContent="✎ edit";
  ed.title="Put this question back in the box to reword and ask again";
  ed.onclick=()=>reAsk(question);
  u.appendChild(ed);
  const trace = document.createElement("details"); trace.className="trace"; trace.open=false;
  const sum = document.createElement("summary"); sum.innerHTML='<span class="spin">◐</span> thinking…';
  const body = document.createElement("div"); body.className="tracebody";
  trace.appendChild(sum); trace.appendChild(body);
  const ans = document.createElement("div"); ans.className="answer";
  const stream = document.createElement("div"); stream.className="stream"; ans.appendChild(stream);
  t.appendChild(u); t.appendChild(trace); t.appendChild(ans);
  turns.appendChild(t); scrollDown();
  return {t, trace, sum, body, ans, stream,
          stepEl:null, thinkEl:null, srcEl:null, stepBuf:"", loadTimer:null,
          answering:false, ansLive:null, lastStep:null};
}

function setStatus(ctx, label){   // live one-line status shown while the model works
  if(!ctx.answering) ctx.sum.innerHTML = '<span class="spin">◐</span> ' + label;
}
function setDone(ctx, ok=true){
  ctx.sum.innerHTML = ok ? "✓ reasoning &amp; sources (click to expand)" : "✗ trace";
  ctx.trace.open = false;
}

// An interim answer that turned out to be a lead-in to more research must NOT be
// destroyed — the model may have written good, correct prose before deciding to
// verify. Instead of deleting it, tuck the rendered draft into the trace so it's
// still on the page (collapsed), and nothing the model wrote is ever lost.
function parkDraft(ctx){
  const live = ctx.ansLive; ctx.ansLive = null;
  if(!live) return;
  if(!live.innerHTML.trim()){ live.remove(); return; }   // nothing worth keeping
  const d = document.createElement("div"); d.className = "step draft";
  d.innerHTML = '<span class="steplabel">earlier draft · revised after more research</span>';
  live.classList.add("answer");        // keep the markdown styling once moved out of .ans
  d.appendChild(live);                 // relocate the existing node (detaches it from .ans)
  (ctx.stepEl || ctx.body).appendChild(d);
}

// ---- consume the SSE stream ----
async function ask(question){
  const model = $("#model").value, effort = $("#effort").value;
  liveQuestion = question;   // so Stop can hand the text back for editing
  const ctx = newTurn(question);
  // Send is locked during a run, but the textarea stays enabled so the user can
  // draft the next question while the model is still answering.
  sendMode("stop"); runStarted=performance.now();
  controller = new AbortController();
  let finalText = "";
  try{
    const resp = await fetch("/api/ask",{
      method:"POST", headers:{"Content-Type":"application/json"},
      // `restore` lets the server rebuild this session if it has never heard of the
      // sid — after a server restart the tab still shows the conversation, so the
      // model must get it back too or the next follow-up answers out of nowhere.
      body: JSON.stringify({q:question, model, effort, sid, restore: store.turns}),
      signal: controller.signal,
    });
    const reader = resp.body.getReader(); const dec = new TextDecoder();
    let buf="";
    while(true){
      const {value,done} = await reader.read(); if(done) break;
      buf += dec.decode(value,{stream:true});
      let i;
      while((i = buf.indexOf("\n\n")) >= 0){
        const frame = buf.slice(0,i); buf = buf.slice(i+2);
        if(!frame.startsWith("data:")) continue;
        const ev = JSON.parse(frame.slice(5).trim());
        finalText = handle(ctx, ev) ?? finalText;
        scrollDown();
      }
    }
  }catch(e){
    if(e.name!=="AbortError"){ ctx.stream.textContent = "connection error: "+e.message; }
  }finally{
    clearLoad(ctx);
    if(finalText) rememberTurn(question, finalText);   // survive reload / other tabs
    sendMode("send"); runEnded=performance.now();
    controller=null; $("#q").focus();
  }
}

function clearLoad(ctx){   // cancel the pending "loading model…" status once anything arrives
  if(ctx.loadTimer){ clearTimeout(ctx.loadTimer); ctx.loadTimer=null; }
}
function handle(ctx, ev){
  clearLoad(ctx);
  switch(ev.type){
    case "step":{
      // A prior step may have begun an answer that turned out to be more research.
      // Park that draft in the trace (don't delete it) before opening the new step.
      parkDraft(ctx);
      const s=document.createElement("div"); s.className="step";
      // A step whose every tool call failed (dead link, PDF, consent wall) is refunded
      // server-side, so the same number comes round again — label it a retry rather
      // than showing two blocks that both claim to be "step 3".
      const retry = ctx.lastStep!=null && ev.n<=ctx.lastStep;
      ctx.lastStep = ev.n;
      s.innerHTML=`<span class="steplabel">step ${ev.n}${ev.max?" of "+ev.max:""}`
                + `${retry?' · retry (last source gave nothing)':''}</span>`;
      const th=document.createElement("div"); th.className="think"; s.appendChild(th);
      ctx.body.appendChild(s); ctx.stepEl=s; ctx.thinkEl=th; ctx.stepBuf="";
      ctx.answering=false;
      setStatus(ctx, "thinking…");
      // On the first step, the gap before any token is usually the model loading
      // into RAM (~30s cold). Say so in the status if nothing arrives shortly.
      if(ev.n===1){
        ctx.loadTimer = setTimeout(()=>setStatus(ctx, "loading "+$("#model").value+" into memory (~30s, just once)…"), 1200);
      }
      break;
    }
    case "thinking":
      if(ctx.thinkEl) ctx.thinkEl.textContent += ev.text;
      setStatus(ctx, "thinking…"); break;
    case "answer_chunk":{
      ctx.stepBuf += ev.text;
      if(!ctx.answering){
        const lead = ctx.stepBuf.replace(/^\s+/,"");
        // A tool call is pure JSON starting with "{"; a real answer is prose.
        // The moment real answer text begins: fold the research trace and render
        // in the normal (bright) answer color — so there's no jump at the end.
        if(lead && lead[0] !== "{"){
          ctx.answering = true;
          setDone(ctx, true);                 // mark the trace done (stays collapsed)
          ctx.ansLive = document.createElement("div");
          ctx.ans.insertBefore(ctx.ansLive, ctx.stream);
        }
      }
      // Strip gpt-oss's 【2†L1-L4】 citation tokens from the live view; the final
      // event re-renders from server-side-cleaned text anyway (incl. de-TeXed math).
      if(ctx.answering) ctx.ansLive.innerHTML = markdown(ctx.stepBuf.replace(/【[^】]*】/g,""));
      // else: still a forming tool call — not shown; the status line covers it.
      break;
    }
    case "tool_call":{
      // that streamed content was a lead-in to a tool call, not the final answer.
      // Keep whatever prose already rendered (park it in the trace), then continue.
      parkDraft(ctx);
      ctx.stepBuf=""; ctx.answering=false;
      setStatus(ctx, (ev.tool==="web_fetch"?"reading a page":"searching")+(ev.label?" · "+ev.label:"")+"…");
      const c=document.createElement("span"); c.className="chip tool";
      c.textContent = `⚙ ${ev.tool}(${ev.label||""})`;
      (ctx.stepEl||ctx.body).appendChild(c); break;
    }
    case "observation":{
      const c=document.createElement("span"); c.className="chip"+(ev.ok?"":" err");
      c.textContent = (ev.ok?"✓ ":"✗ ")+ev.preview;
      (ctx.stepEl||ctx.body).appendChild(c); break;
    }
    case "source":{
      if(!ctx.srcEl){ ctx.srcEl=document.createElement("div"); ctx.srcEl.className="src";
        ctx.srcEl.innerHTML='<span class="steplabel">sources read</span><br>'; ctx.body.appendChild(ctx.srcEl); }
      const a=document.createElement("a"); a.href=ev.url; a.target="_blank"; a.rel="noopener";
      a.textContent="• "+ev.url; a.style.display="block"; ctx.srcEl.appendChild(a); break;
    }
    case "notice":{
      const c=document.createElement("span"); c.className="chip warn"; c.textContent="⤴ "+ev.text;
      (ctx.stepEl||ctx.body).appendChild(c); break;
    }
    case "final":{
      ctx.ans.innerHTML = markdown(ev.text);
      addCopyBar(ctx.ans, ev.text);
      setDone(ctx,true); return ev.text;
    }
    case "error":
      ctx.stream.textContent = "⚠ "+ev.text; setDone(ctx,false); break;
    case "done":
      if(ctx.sum.querySelector(".spin")) setDone(ctx,true); break;
  }
}

// ---- wiring ----
const hintEl=$("#hint"), hintDefault=hintEl.textContent; let hintTimer=null;
function flashHint(msg){
  hintEl.textContent=msg;
  clearTimeout(hintTimer); hintTimer=setTimeout(()=>hintEl.textContent=hintDefault, 2000);
}
// Same line, but it stays put — for work that outlasts flashHint's 2s (a cold model
// load runs ~30s and longer for the big ones). Ended by the next flashHint.
function holdHint(msg){ clearTimeout(hintTimer); hintEl.textContent=msg; }

// ---- confirm sheet ----
// Resolves true on OK, false on Cancel / Esc / clicking the backdrop.
const modal=$("#modal"); let modalDone=null;
function confirmSheet(title, bodyHTML){
  $("#modaltitle").textContent=title; $("#modaltext").innerHTML=bodyHTML;
  modal.hidden=false; $("#modalok").focus();
  return new Promise(res => modalDone = res);
}
function closeSheet(v){ modal.hidden=true; const f=modalDone; modalDone=null; if(f) f(v); }
$("#modalcancel").onclick=()=>closeSheet(false);
$("#modalok").onclick=()=>closeSheet(true);
modal.addEventListener("click", e=>{ if(e.target===modal) closeSheet(false); });   // backdrop
addEventListener("keydown", e=>{
  if(modal.hidden) return;
  if(e.key==="Escape"){ e.preventDefault(); closeSheet(false); }
  if(e.key==="Enter"){ e.preventDefault(); closeSheet(true); }
});

// ---- switching models trades one model's RAM for another's ----
// On this machine two 100B-class models don't fit at once, so picking a different one
// is not a free menu choice: the old one is dropped and the new one is pulled in (~30s
// cold, longer for the big ones). That's worth a confirm rather than a surprise.
$("#model").addEventListener("change", async () => {
  const sel=$("#model"), next=sel.value, prev=currentModel;
  if(!prev || next===prev) { currentModel = next; return; }
  if(controller){          // mid-answer: the running turn is using the current model
    sel.value = prev;
    flashHint("⏳ can't switch models while an answer is streaming");
    return;
  }
  const ok = await confirmSheet("Switch model?",
    `<p>This deactivates <span class="name">${esc(prev)}</span>, freeing its RAM, ` +
    `then activates <span class="name">${esc(next)}</span>.</p>` +
    `<p>Loading the new model takes ~30s (longer for the largest ones). ` +
    `Your conversation is kept.</p>`);
  if(!ok){ sel.value = prev; return; }
  sel.disabled=true;
  holdHint("⟳ switching to "+next+" — loading into memory…");
  try{
    const r = await fetch("/api/switch",{method:"POST",headers:{"Content-Type":"application/json"},
                                         body:JSON.stringify({from:prev, to:next})});
    if(!r.ok) throw new Error("HTTP "+r.status);
    currentModel = next;
    flashHint("✓ "+next+" is loaded and ready");
  }catch(e){
    sel.value = prev;    // the switch failed; the selector must not lie about what's live
    flashHint("⚠ switch failed — staying on "+prev);
  }finally{ sel.disabled=false; }
});
// Shell-style command history: Up/Down cycle through prior questions.
const history=[]; let hIdx=0, draft="";
function send(){
  // While an answer is streaming, typing is free but sending is locked: wait for
  // it to finish or press Stop. The drafted text stays in the box either way.
  if(controller){ flashHint("⏳ model is still answering — wait or press Stop, your draft is kept"); return; }
  const q=$("#q").value.trim(); if(!q) return;
  if(history[history.length-1]!==q) history.push(q);  // no consecutive dupes
  hIdx=history.length; draft="";
  $("#q").value=""; autosize($("#q")); stick=true; ask(q);
}
// Grow with the text, but never below the two-row resting height (--qmin).
const QMIN = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--qmin")) || 74;
function autosize(el){
  el.style.height = QMIN + "px";
  const need = Math.max(el.scrollHeight, QMIN);
  el.style.height = Math.min(need, 180) + "px";
  // Only scroll once the box has hit its ceiling; otherwise a stray scrollbar
  // appears inside a box that is already tall enough for its text.
  el.style.overflowY = need > 180 ? "auto" : "hidden";
}
// Pull a question back into the composer to reword and ask again — from the ✎ button
// on any past question, and automatically on Stop, since stopping nearly always means
// "that came out wrong" and the very next thing you want is the text back to edit.
function reAsk(text){
  const el=$("#q"), cur=el.value.trim();
  if(cur && cur!==text.trim()){   // never clobber a draft the user is in the middle of
    flashHint("✎ your draft is still in the box — clear it first"); return;
  }
  el.value=text; autosize(el); el.focus();
  el.setSelectionRange(el.value.length, el.value.length);  // caret at end, ready to edit
}
// One button, two jobs: Send at rest, Stop while an answer streams. Merged so the
// primary button is never a dead disabled control — its click always does the one
// thing that makes sense right now.
function sendMode(mode){
  const b=$("#send"), stopping = mode==="stop";
  b.classList.toggle("stopping", stopping);
  b.textContent = stopping ? "" : "⏎";   // stop is drawn by CSS; send is the return sign
  b.title = stopping ? "Stop the answer — your question comes back to edit"
                     : "Send — or press Enter";
}
// Double-click protection, both directions. The same button sends and stops, so
// the second click of a double-click always lands in the OPPOSITE mode: right
// after Send it would stop the barely-started run; right after Stop (which puts
// the question back in the box) it would instantly re-send it. Both are echoes
// of the first click, not decisions — a real change of heart takes longer.
let runStarted=0, runEnded=0;
$("#send").onclick=()=>{
  if(controller){
    if(performance.now()-runStarted<400) return;
    const q=liveQuestion;    // read before abort(), which clears the run state
    controller.abort();
    if(q) reAsk(q);
    return;
  }
  if(performance.now()-runEnded<400) return;
  send();
};
$("#newchat").onclick=()=>{
  // Abort any run in flight: otherwise it keeps generating into the (now cleared)
  // page and holds Send locked until it finishes on its own.
  if(controller) controller.abort();
  store={sid:crypto.randomUUID(), turns:[]}; sid=store.sid; saveStore();
  turns.innerHTML=""; $("#q").focus(); };
$("#sayhi").onclick=()=>{ if(controller) return; stick=true; ask("Hi"); };  // warm the model without typing
$("#deactivate").onclick=async()=>{                       // unload the model from RAM on demand
  const m=$("#model").value;
  if(!m || m==="(no models)") return;
  const btn=$("#deactivate"), old=btn.textContent;
  btn.disabled=true; btn.textContent="Unloading…";
  try{
    const r=await fetch("/api/unload",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({model:m})});
    btn.textContent = r.ok ? "Unloaded ✓" : "Failed";
  }catch(e){ btn.textContent="Failed"; }
  setTimeout(()=>{ btn.textContent=old; btn.disabled=false; }, 1400);
};
$("#q").addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); return; }
  const el=e.target, atStart=el.selectionStart===0 && el.selectionEnd===0,
        atEnd=el.selectionStart===el.value.length && el.selectionEnd===el.value.length;
  // Up recalls older questions — only when caret is at the very start, so
  // multi-line editing (moving up within text) still works normally.
  if(e.key==="ArrowUp" && atStart && history.length){
    e.preventDefault();
    if(hIdx===history.length) draft=el.value;   // stash what you were typing
    hIdx=Math.max(0,hIdx-1);
    el.value=history[hIdx]; autosize(el); el.setSelectionRange(0,0);
  } else if(e.key==="ArrowDown" && atEnd && hIdx<history.length){
    e.preventDefault();
    hIdx++;
    el.value=hIdx===history.length ? draft : history[hIdx];
    autosize(el); const n=el.value.length; el.setSelectionRange(n,n);
  }
});
$("#q").addEventListener("input", e => autosize(e.target));
document.addEventListener("keydown", e => {
  if (e.key !== "/" || e.ctrlKey || e.altKey || e.metaKey) return;
  const t = e.target;
  if (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.isContentEditable) return;
  e.preventDefault();
  $("#q").focus();
});
// ---- tab presence ----
// Tell the server this tab exists, so the workhorse model only keeps its long 45m
// keep-alive while someone is here. On the last tab closing, the server drops it to
// the normal 5m default instead of holding ~65 GB of RAM for nothing. A hidden tab
// still counts as open, so the heartbeat keeps running in the background.
const tabId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
const beat = (path, keepalive) => fetch(path, {method:"POST", keepalive,
  headers:{"Content-Type":"application/json"}, body:JSON.stringify({tab:tabId})}).catch(()=>{});
const ping = () => beat("/api/ping", false);
ping(); setInterval(ping, 30000);
// pagehide covers close/navigate/mobile better than beforeunload; sendBeacon survives
// the teardown. If the page comes back from the bfcache, re-announce ourselves.
addEventListener("pagehide", () => {
  const body = new Blob([JSON.stringify({tab:tabId})], {type:"application/json"});
  if(!navigator.sendBeacon("/api/bye", body)) beat("/api/bye", true);
});
addEventListener("pageshow", ping);

// The intelligence selector is three cups; clicking one sets the water line. The
// hidden #effort input carries the value, so ask() reads it exactly as before.
const effortWrap = document.querySelector(".effortpick");
document.querySelectorAll(".cup").forEach(b => b.onclick = () => {
  $("#effort").value = b.dataset.level;
  effortWrap.dataset.level = b.dataset.level;
});
autosize($("#q"));   // settle the box at exactly its resting height, so the first
                     // keystroke can't nudge it by a pixel

// Replay the stored conversation, then keep tabs on the same session in step: the
// `storage` event fires in every OTHER tab when one of them writes, so an answer
// finished in one tab shows up in the others. Skipped while this tab is mid-run —
// its own turn is still streaming into the page and would be interleaved.
store.turns.forEach(t => renderSaved(t.q, t.a));
stickToBottom();
addEventListener("storage", e => {
  if(e.key !== SKEY) return;
  const s = loadStore(); if(!s) return;
  if(s.sid !== sid){                       // another tab pressed New chat
    store = s; sid = s.sid;
    if(controller) controller.abort();
    turns.innerHTML = ""; s.turns.forEach(t => renderSaved(t.q, t.a));
  }else if(!controller && s.turns.length > store.turns.length){
    s.turns.slice(store.turns.length).forEach(t => renderSaved(t.q, t.a));
    store = s;
  }else{
    store = s;                             // keep the data, don't touch the view
  }
  stickToBottom();
});

loadModels(); $("#q").focus();
</script>
</body>
