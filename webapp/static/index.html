<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>research</title>
<style>
  :root{
    --bg:#f7f7f6; --panel:#ffffff; --ink:#1c1c1a; --dim:#6b6b66; --line:#e4e4e0;
    --accent:#2f6f4f; --accent-ink:#fff; --chip:#eef2f0; --link:#1e6f8c; --warn:#9a6b1a;
    --stop:#a03535; --stop-ink:#fff;
    --user:#eef3f7;
    --qmin:44px;   /* one row at rest — the JS autosize floor matches it exactly */
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17181a; --panel:#1f2124; --ink:#e9e9e6; --dim:#9a9a94; --line:#31343a;
      --accent:#4a9d74; --accent-ink:#0c0f0d; --chip:#26292e; --link:#6fc0dc; --warn:#d0a24f;
      --stop:#d16a6a; --stop-ink:#160c0c;
      --user:#232a31;
    }
  }
  *{box-sizing:border-box}
  /* [hidden] is only a display:none in the UA sheet, so ANY display rule of ours beats
     it on specificity and the element stays on screen. The mic is flex and starts
     hidden, so without this a server without faster-whisper still draws it. */
  [hidden]{display:none !important}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;
       display:flex;flex-direction:column}
  header{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;
         padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  /* a long model name shouldn't be able to push the row into wrapping */
  /* The one control you hunt for by eye, so it is set a fifth larger than the rest of the
     header and its rows are given room to breathe — scanning a list of near-identical
     names is much easier when they are not stacked tight. Firefox honours padding and
     font-size on <option> inside the dropdown; where a browser ignores them the list just
     falls back to its native metrics, which is no worse than before. */
  #model{max-width:270px;font-size:18px}
  #model option{font-size:18px;padding:7px 10px;line-height:1.7}
  /* the writing-style block now carries the auto margin, so it sits beside the title
     and everything else is pushed to the right edge */
  header .title{font-weight:600}
  /* The header is a single row of controls; below this the tagline is the one piece
     that is decoration rather than function, so it steps aside before anything wraps. */
  @media (max-width:1200px){ header .title small{display:none} }
  header .title small{color:var(--dim);font-weight:400}
  select,button{font:inherit;color:var(--ink);background:var(--panel);
                border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  #convo{flex:1;overflow-y:auto;padding:20px 0}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px}
  .turn{margin:0 0 26px}
  .user{background:var(--user);border:1px solid var(--line);border-radius:12px;
        padding:10px 14px;white-space:pre-wrap;word-wrap:break-word;position:relative}
  .user .edit{position:absolute;top:5px;right:5px;opacity:0;transition:opacity .12s;
        background:var(--user);border:1px solid var(--line);color:var(--dim);
        border-radius:6px;padding:1px 7px;font-size:12px;cursor:pointer}
  .user:hover .edit,.user .edit:focus{opacity:1}
  .user .edit:hover{color:var(--ink);border-color:var(--dim)}
  details.trace{margin:10px 0 0;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  details.trace>summary{cursor:pointer;padding:8px 12px;color:var(--ink);font-size:13px;
        list-style:none;display:flex;gap:8px;align-items:center}
  details.trace>summary::-webkit-details-marker{display:none}
  details.trace>summary .spin{display:inline-block}
  .tracebody{padding:6px 12px 12px;font-size:13px;color:var(--ink);
        border-top:1px solid var(--line)}
  .step{margin-top:8px}
  .steplabel{color:var(--dim);font-weight:600;font-size:12px;letter-spacing:.03em}
  .think{white-space:pre-wrap;margin:2px 0 0}
  .chip{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 7px;margin:3px 4px 0 0;
        font-size:12px}
  .chip.tool{color:var(--accent)}
  .chip.warn{color:var(--warn)}
  .chip.err{color:#c0392b}
  .src a{color:var(--link);text-decoration:none;word-break:break-all}
  .src a:hover{text-decoration:underline}
  .answer{margin-top:12px}
  .answer h1,.answer h2,.answer h3{font-size:1.05em;margin:1em 0 .3em}
  .answer p{margin:.5em 0}
  .answer ul,.answer ol{margin:.4em 0 .4em 1.3em;padding:0}
  .answer code{background:var(--chip);padding:1px 5px;border-radius:5px;font-size:.9em}
  .answer pre{background:var(--chip);padding:10px;border-radius:8px;overflow-x:auto}
  .answer a{color:var(--link)}
  .answer table{border-collapse:collapse;margin:.7em 0;width:100%;font-size:.95em;
        display:block;overflow-x:auto}
  .answer th,.answer td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
  .answer thead th{background:var(--chip)}
  .answerbar{margin-top:6px}
  .answerbar button{padding:3px 9px;font-size:12px}
  .stream{white-space:pre-wrap}
  .draft{margin-top:8px;opacity:.72}
  .draft .steplabel{color:var(--warn)}
  footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 0}
  .composer{display:flex;gap:8px;align-items:flex-end}
  /* Intelligence selector: three cups, water level = how hard the model thinks.
     Click a cup; the chosen one holds coloured water (slate / blue / violet), the
     others stay ghosted at their levels so the whole scale is visible at once.
     Sits beside Send, so the level is set where the question is written. */
  /* Three cups; the water level is how hard the model thinks. No labels — the shape
     carries the meaning, and hovering names the level. */
  .effortpick{display:flex;align-items:center;gap:8px;--lvl:var(--dim)}
  /* The word rides the bottom rim of the cups box like a fieldset legend — half
     above the line, half below. Panel background so it interrupts the border
     cleanly, and it takes the chosen level's colour. */
  .effortword{position:absolute;left:50%;bottom:0;transform:translate(-50%,50%);
              background:var(--panel);padding:0 6px;
              color:var(--lvl);font-size:12px;font-weight:600;white-space:nowrap;
              transition:color .2s}
  .effortpick[data-level="low"]   {--lvl:#7f93a8}   /* slate — quick sip          */
  .effortpick[data-level="medium"]{--lvl:#4ea1ff}   /* blue  — the everyday glass */
  /* Orange, not another cool tone: low and medium already ramp slate -> blue, so a
     warm top step reads as heat rather than just "more blue", and it can't be
     mistaken for the everyday level at a glance. */
  .effortpick[data-level="high"]  {--lvl:#ff8b30}   /* orange — filled to the brim */
  /* Fills its parent's height, so the footer reads as one block rather than a row of
     floating widgets. Tight padding keeps the cups themselves tall inside it. */
  /* The negative bottom margin lets the cups reach down past the composer, level with
     the hint line, so they get real height without making the input taller. */
  .cups{position:relative;display:flex;align-items:flex-end;gap:7px;padding:6px 9px 10px;
        background:var(--panel);
        border:1px solid var(--line);border-radius:12px;margin-bottom:-21px}
  .cup{position:relative;width:24px;height:63px;padding:0;cursor:pointer;
       background:var(--bg);border:1px solid var(--line);border-radius:3px 3px 9px 9px;
       overflow:hidden;transition:border-color .2s,box-shadow .2s,transform .12s}
  .cup:hover{transform:translateY(-2px)}
  .cup .water{position:absolute;left:0;right:0;bottom:0;background:var(--line);
              transition:height .3s cubic-bezier(.3,1.4,.5,1),background .2s}
  .cup .water::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;
                     background:rgba(255,255,255,.22)}   /* the water's surface */
  .cup[data-level="low"]    .water{height:32%}
  .cup[data-level="medium"] .water{height:62%}
  .cup[data-level="high"]   .water{height:94%}
  /* the chosen cup: coloured water, lit rim, and the label takes the colour too */
  .effortpick[data-level="low"]    .cup[data-level="low"],
  .effortpick[data-level="medium"] .cup[data-level="medium"],
  .effortpick[data-level="high"]   .cup[data-level="high"]{
    border-color:var(--lvl);
    box-shadow:0 0 7px color-mix(in srgb, var(--lvl) 55%, transparent)}
  .effortpick[data-level="low"]    .cup[data-level="low"] .water,
  .effortpick[data-level="medium"] .cup[data-level="medium"] .water,
  .effortpick[data-level="high"]   .cup[data-level="high"] .water{
    background:linear-gradient(to top,
      var(--lvl), color-mix(in srgb, var(--lvl) 72%, white))}
  /* One row at rest. It used to OPEN at the browser's natural two-row height and then
     snap down to one row on the first keystroke, because autosize reset it to 44px.
     The height was never the problem — the disagreement was. CSS and JS now share
     --qmin, so it opens at one row and stays there until the text needs more. */
  textarea{flex:1;resize:none;min-height:var(--qmin);max-height:180px;font:inherit;color:var(--ink);
           background:var(--bg);border:1px solid var(--line);border-radius:10px;
           padding:10px 48px 10px 12px}   /* right padding clears the send button */
  /* The browser's default focus ring follows the OS accent colour, which painted the
     box a loud red/amber. Replace it with a quiet grey rim — still an obvious focus
     cue, but it stops the composer shouting while you type. */
  textarea:focus{outline:none;border-color:var(--dim)}
  /* The send button lives INSIDE the prompt box, pinned to its bottom-right corner
     (it stays put while the box grows), the way chat apps put the arrow in the field.
     No background disc — the bare sign carries the state through its colour alone. */
  .qwrap{position:relative;flex:1;display:flex}
  #send{position:absolute;right:7px;bottom:6px;width:32px;height:32px;padding:0;
        background:none;border:none;color:var(--accent);font-size:19px;line-height:1;
        display:flex;align-items:center;justify-content:center}
  /* The stop sign is drawn, not typed: a font glyph sits on its baseline, which parks
     it low in the button no matter how the box is centred. An empty bordered box is
     centred by the flex rules above, and being a border it can't read as "filled". */
  #send.stopping{color:var(--stop)}
  #send.stopping::before{content:"";width:13px;height:13px;
                         border:2px solid currentColor;border-radius:3px}
  .hint{color:var(--dim);font-size:12px;margin-top:6px;text-align:center}
  /* New chat sits with the title as the only control on the left; its auto margin is
     what pushes the model row to the right edge. The left margin sets the app's name
     apart, so the tagline reads as a caption rather than as a label for the button. */
  /* Title + New chat sit left; the model controls sit in the true centre of the header.
     Two grid children across `1fr auto 1fr` does that honestly: the empty third column
     balances the first, so the middle group is centred on the page rather than on
     whatever space the title happens to leave over. Auto margins can't achieve that —
     they only centre within the leftover space, which drifts as the title changes. */
  #newchat{margin-left:26px}
  .hdrleft,.hdrmid{display:flex;gap:8px;align-items:center;min-width:0}
  .hdrmid{justify-self:center}
  /* Model status. This box runs several LLMs across two runtimes, and the one thing you
     cannot tell by looking is which of them is holding the RAM — Ollama's own view is
     blind to llama.cpp. So the header says it continuously: ours, anyone else's, and
     what is left. The third grid column was already there, empty, balancing the first. */
  /* overflow:hidden here and min-width:0 on the text are what make the ellipsis work:
     a nowrap flex item refuses to shrink below its content otherwise, and the line
     would silently overrun the model controls instead of truncating. */
  /* NOT justify-self:end — that sizes the item to its content, which then overruns the
     track to the left and lands on top of the model controls. Stretching it to the
     track and pushing the content right keeps the width honest, so the clip can bite. */
  .hdrright{display:flex;justify-content:flex-end;align-items:center;
            min-width:0;overflow:hidden}
  .mstate{display:inline-flex;align-items:center;gap:7px;min-width:0;max-width:100%;
          font-size:12px;color:var(--dim);white-space:nowrap;cursor:default}
  .mstate .txt{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .mstate .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
  .mstate.live .dot{background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .mstate.busy .dot{background:var(--warn);box-shadow:0 0 6px var(--warn)}
  .mstate b{font-weight:600;color:var(--ink)}
  /* free memory earns colour only when it starts to matter */
  .mstate .free.tight{color:var(--warn)}
  .mstate .free.full{color:var(--stop);font-weight:600}
  /* Below the grid's comfortable width, fall back to one wrapping flex row. */
  @media (max-width:1100px){
    header{display:flex;flex-wrap:wrap}
    .hdrmid{justify-self:auto;flex-wrap:wrap}
  }
  /* That gap exists to set the tagline apart, so it leaves when the tagline does —
     keeping it would cost a whole wrapped row on a narrow window. Must sit AFTER the
     rule above: a media query adds no specificity, so source order decides. */
  @media (max-width:1200px){ #newchat{margin-left:0} }
  /* confirm sheet — used when switching models trades one model's RAM for another's */
  .modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
         background:rgba(0,0,0,.45);padding:20px}
  .modal[hidden]{display:none}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;
         padding:18px 20px;max-width:460px;width:100%;box-shadow:0 14px 44px rgba(0,0,0,.4)}
  .sheet h3{margin:0 0 10px;font-size:16px}
  .sheet p{margin:0 0 8px;color:var(--dim);font-size:14px;line-height:1.55}
  .sheet .name{color:var(--ink);font-weight:600;word-break:break-all}
  .modalbar{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  /* Dictation sits next to Send, pinned the same way — the two things that put words
     in front of the model share one corner. Recording turns it the stop colour and
     breathes, so the open microphone is visible without reading the hint line. */
  #mic{position:absolute;right:41px;bottom:6px;width:32px;height:32px;padding:0;
       background:none;border:none;color:var(--dim);
       display:flex;align-items:center;justify-content:center}
  #mic svg{width:17px;height:17px;fill:currentColor}
  #mic:hover{color:var(--ink)}
  #mic.rec{color:var(--stop);animation:micpulse 1.4s ease-in-out infinite}
  #mic.busy{opacity:.45;cursor:default;animation:none}
  @keyframes micpulse{50%{opacity:.35}}
  /* The box only gives up the extra right margin once the server says it can
     transcribe; without dictation the text still runs to within 48px of the edge. */
  body.voice textarea{padding-right:80px}
  @media (prefers-reduced-motion:reduce){ #mic.rec{animation:none} }
  /* Track and knob are shared by every role="switch" in the page, so a second switch
     cannot quietly drift away from the first. Layout stays per-control. */
  [role="switch"] .track{position:relative;width:34px;height:19px;border-radius:19px;
                background:var(--chip);border:1px solid var(--line);
                transition:background .18s,border-color .18s}
  [role="switch"] .knob{position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
               background:var(--dim);transition:transform .18s,background .18s}
  [role="switch"]:hover{color:var(--ink)}
  [role="switch"]:hover .track{border-color:var(--dim)}
  [role="switch"][aria-checked="true"] .track{background:var(--accent);border-color:transparent}
  [role="switch"][aria-checked="true"] .knob{background:var(--accent-ink);transform:translateX(15px)}
  /* Read this answer aloud. Drawn twice per answer — level with the first line and
     again in the bar at the end — so a long answer never has to be scrolled back to
     the top to start it. Both are the same control and light up together. */
  .speakbtn{background:none;border:none;padding:2px 4px;cursor:pointer;color:var(--dim);
            line-height:0}
  .speakbtn svg{width:16px;height:16px;fill:currentColor}
  .speakbtn:hover{color:var(--ink)}
  .speakbtn.talking{color:var(--accent);animation:speakpulse 1.2s ease-in-out infinite}
  @keyframes speakpulse{50%{opacity:.45}}
  @media (prefers-reduced-motion:reduce){ .speakbtn.talking{animation:none} }
  /* The top one floats, so the first paragraph flows around it instead of running
     underneath it — no reserved gutter, and nothing moves when it isn't there. */
  .speakbtn.top{float:right;margin:2px 0 4px 10px}
</style>
</head>
<body>
  <header>
   <div class="hdrleft">
    <span class="title">research <small>· web-capable LLM</small></span>
    <button id="newchat">New chat</button>
   </div>
   <div class="hdrmid">
    <button id="sayhi" title="Warm up the selected model so it's ready — no need to type hi">Say Hi!</button>
    <label><small style="color:var(--dim)">model</small></label>
    <select id="model"></select>
    <!-- Writing style, in words rather than a number. The select's VALUE is the sampling
         temperature itself, so ask() keeps reading #temp exactly as before — no hidden
         input to keep in step, and the browser remembers the pick for free. -->
    <label><small style="color:var(--dim)">writing style</small></label>
    <select id="temp" autocomplete="off" aria-label="writing style">
      <option value="0.4" title="Sticks closely to the most likely wording. Tightest and most repeatable.">Precise</option>
      <option value="0.6" selected title="A little room to vary, still firmly grounded. The default.">Balanced</option>
      <option value="0.8" title="Explores more phrasings and angles.">Curious</option>
      <option value="1" title="The model's full range — OpenAI's recommended sampling for gpt-oss. Try it if answers start repeating themselves or re-searching the same pages.">Creative</option>
    </select>
    <button id="deactivate" title="Unload the selected model from RAM to free memory">Deactivate</button>
   </div>
   <div class="hdrright">
    <span id="mstate" class="mstate" title="checking what is loaded…">
      <i class="dot"></i><span class="txt">checking memory…</span></span>
   </div>
  </header>

  <div id="convo"><div class="wrap" id="turns"></div></div>

  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modaltitle">
      <h3 id="modaltitle">Switch model?</h3>
      <div id="modaltext"></div>
      <div class="modalbar">
        <button id="modalcancel">Cancel</button>
        <button id="modalok" class="primary">OK</button>
      </div>
    </div>
  </div>

  <footer><div class="wrap">
    <div class="composer">
      <!-- rows=1: without it the browser opens the box at its default TWO rows, which
           min-height can't shrink, and the first keystroke snapped it down to one. -->
      <div class="qwrap">
        <textarea id="q" rows="1" placeholder="Ask anything — parentheses, quotes, symbols all fine here."></textarea>
        <button id="mic" hidden aria-label="Dictate" title="Dictate — click to start, click again to stop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M6 11a1 1 0 0 1 2 0 4 4 0 0 0 8 0 1 1 0 0 1 2 0 6 6 0 0 1-5 5.92V19h2a1 1 0 0 1 0 2H9a1 1 0 0 1 0-2h2v-2.08A6 6 0 0 1 6 11z"/></svg></button>
        <button id="send" title="Send — or press Enter">⏎</button>
      </div>
      <div class="effortpick" data-level="medium">
        <!-- A hidden input carries the value so ask() keeps reading #effort as before.
             autocomplete=off so the browser's own form restore can't fight the pick the
             tab keeps in sessionStorage (see setEffort). -->
        <input type="hidden" id="effort" value="medium" autocomplete="off">
        <div class="cups" role="radiogroup" aria-label="intelligence">
          <button type="button" class="cup" data-level="low"
                  title="low — quick, snappy answers" aria-label="low intelligence"><span class="water"></span></button>
          <button type="button" class="cup" data-level="medium"
                  title="medium — the everyday level (default)" aria-label="medium intelligence"><span class="water"></span></button>
          <button type="button" class="cup" data-level="high"
                  title="high — thinks long and hard before answering" aria-label="high intelligence"><span class="water"></span></button>
          <small class="effortword">capacity</small>
        </div>
      </div>
    </div>
    <div class="hint" id="hint">Enter to send · Shift+Enter for a new line · everything runs locally</div>
  </div></footer>

<script>
const $ = s => document.querySelector(s);
const turns = $("#turns"), convo = $("#convo");
let controller = null, liveQuestion = null;
let switching = false;   // a model is being loaded into RAM; sending must wait for it

// ---- the conversation, kept per tab in sessionStorage ----
// One tab is one conversation. sessionStorage is scoped to the tab, so a reload keeps
// the thread (the sid must survive it, or the session sits unreachable in the server's
// memory) while a second tab starts its own — which is the point: two tabs are two
// questions in parallel, not one thread rendered twice. This was localStorage, and
// that store is shared by every tab of the origin: a new tab replayed the first tab's
// conversation, and New chat there wiped the others. Deliberately client-side still: a
// server "read my history" route would be a second way to pull conversations back out
// over HTTP, which history.py's whole posture is built to avoid.
const SKEY = "research.session";
// The old shared copy would otherwise sit in localStorage forever, unread — and it is
// conversation text, so leaving it behind is the wrong default.
try{ localStorage.removeItem(SKEY); }catch(e){}
const KEEP_TURNS = 8;          // mirrors the server's RESEARCH_MAX_HISTORY_TURNS
function loadStore(){
  try{
    const s = JSON.parse(sessionStorage.getItem(SKEY));
    if(s && typeof s.sid === "string" && Array.isArray(s.turns)) return s;
  }catch(e){}                  // unparseable/absent: start fresh rather than break
  return null;
}
function saveStore(){ try{ sessionStorage.setItem(SKEY, JSON.stringify(store)); }catch(e){} }
let store = loadStore() || {sid: crypto.randomUUID(), turns: []};
let sid = store.sid;
saveStore();
// Duplicating a tab copies sessionStorage, so the copy wakes up holding its source's
// sid — and the two pages were then ONE conversation on the server, each model reading
// the other page's questions. The server owns the answer to "whose sid is this"; when
// it says another live tab has it, this tab starts its own thread. The turns it shows
// stay, and go up as `restore`, so the new thread remembers exactly what is on screen.
function rotateSid(){ store.sid = crypto.randomUUID(); sid = store.sid; saveStore(); }
function rememberTurn(q, a){
  store.turns.push({q, a});
  if(store.turns.length > KEEP_TURNS) store.turns = store.turns.slice(-KEEP_TURNS);
  saveStore();
}

// ---- the tab is named after its thread ----
// Every tab read "research", which is no help at all once five of them are open on five
// different threads — the whole point of a session per tab. The first question names the
// thread: it is what you remember the thread BY, and it is known the moment you ask
// rather than after an answer comes back, so the tab is labelled while the answer is
// still streaming. Kept in the store rather than re-derived from turns[0] so a thread
// whose first answer was stopped or failed still knows its name after a reload.
const TITLE_MAX = 48;   // a crowded tab strip shows far less; the rest is for hover
function topicFrom(q){
  const one = q.replace(/\s+/g, " ").trim();
  if(one.length <= TITLE_MAX) return one;
  // Cut on a word boundary, but only if one is near enough the end that we aren't
  // throwing away most of the title to find it.
  const cut = one.slice(0, TITLE_MAX), sp = cut.lastIndexOf(" ");
  return (sp > TITLE_MAX * 0.6 ? cut.slice(0, sp) : cut).replace(/[\s,;:.!?-]+$/, "") + "…";
}
// Fall back to the app name: an untitled tab is a thread you haven't asked anything in.
function applyTitle(){ document.title = store.title || "research"; }
function nameThread(q){
  if(store.title) return;             // the first question names it, later ones don't
  const t = topicFrom(q);
  if(!t) return;
  store.title = t; saveStore(); applyTitle();
}
applyTitle();   // a reloaded tab wears its name again before anything is painted

// ---- minimal, dependency-free markdown -> safe HTML ----
// Quotes must be escaped too: inline() builds href="..." attributes out of this
// text, and an unescaped " in a model-written URL would break out of the
// attribute and become live script (the URLs come from fetched web pages).
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");   // italics, after bold
  s = s.replace(/(https?:\/\/[^\s<)\]]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  return s;
}
function markdown(text){
  const lines = text.split("\n"); let html="", list=null, i=0;
  const closeList=()=>{ if(list){ html+=`</${list}>`; list=null; } };
  const isSep = s => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(s);
  const cells = s => s.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(x=>x.trim());
  while(i < lines.length){
    const line = lines[i].replace(/\s+$/,"");
    // GFM table: a header row of pipes followed by a |---|---| separator
    if(line.includes("|") && i+1 < lines.length && isSep(lines[i+1])){
      closeList();
      html += "<table><thead><tr>" + cells(line).map(h=>`<th>${inline(h)}</th>`).join("") + "</tr></thead><tbody>";
      i += 2;
      while(i < lines.length && lines[i].includes("|") && lines[i].trim() !== ""){
        html += "<tr>" + cells(lines[i]).map(c=>`<td>${inline(c)}</td>`).join("") + "</tr>";
        i++;
      }
      html += "</tbody></table>"; continue;
    }
    let m;
    if((m=line.match(/^(#{1,3})\s+(.*)$/))){ closeList(); const n=m[1].length; html+=`<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if((m=line.match(/^\s*[-*]\s+(.*)$/))){ if(list!=="ul"){closeList();list="ul";html+="<ul>";} html+=`<li>${inline(m[1])}</li>`; i++; continue; }
    if((m=line.match(/^\s*\d+[.)]\s+(.*)$/))){ if(list!=="ol"){closeList();list="ol";html+="<ol>";} html+=`<li>${inline(m[1])}</li>`; i++; continue; }
    if(line.trim()===""){ closeList(); i++; continue; }
    closeList(); html+=`<p>${inline(line)}</p>`; i++;
  }
  closeList(); return html;
}

// ---- models ----
let currentModel = null;   // what is actually loaded/selected, so a cancelled switch can revert
// The picker answers one question — who replies to the next message — and a raw tag like
// "gpt-oss:120b" answers it slowly: all-lowercase names blur into each other at a glance,
// and the parameter count is noise at the moment of choosing. So the label is the name
// alone, capitalised the way it is actually spoken, which gives the eye a shape to catch.
// The option's VALUE keeps the exact tag the server expects.
const UPPERCASE_WORDS = /^(gpt|oss)$/i;
function prettyModel(name){
  return name.split(":")[0].split("-")
    .map(w => UPPERCASE_WORDS.test(w) ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1))
    .join("-");
}

async function loadModels(){
  try{
    const r = await fetch("/api/models"); const d = await r.json();
    const sel = $("#model"); sel.innerHTML="";
    // This tab's own pick if it has one (a reload keeps it); a new tab starts on the
    // model used most recently, which is the one most likely to already be in RAM.
    const names = d.models || [];
    const mine = (()=>{ try{ return sessionStorage.getItem(MODEL_KEY); }catch(e){ return null; } })();
    const active = names.includes(mine) ? mine : (d.active || d.default);
    // Dropping the tag makes two builds of one model (gpt-oss:120b and gpt-oss:20b) read
    // identically, and two indistinguishable rows would be worse than the tag ever was.
    // Only a name that collides falls back to the full tag; the rest stay clean.
    const pretty = names.map(prettyModel);
    names.forEach((name, i)=>{
      const o=document.createElement("option");
      o.value=name;                       // the VALUE stays the exact tag the server needs
      o.textContent = pretty.indexOf(pretty[i]) === pretty.lastIndexOf(pretty[i]) ? pretty[i] : name;
      if(name===active) o.selected=true; sel.appendChild(o);
    });
    if(!names.length){ const o=document.createElement("option"); o.textContent="(no models)"; sel.appendChild(o); }
    currentModel = sel.value;   // the baseline a switch is measured against
    // The mic exists only if the server can transcribe AND this browser will hand us
    // audio: getUserMedia is absent outside a secure context, and Firefox can null it
    // out entirely via media.navigator.enabled.
    if(d.voice && navigator.mediaDevices?.getUserMedia && window.MediaRecorder){
      $("#mic").hidden=false; document.body.classList.add("voice");
    }
    // Answers get a speaker button only if the server can actually synthesise; the
    // class is read by addSpeakButtons, so a machine without Kokoro shows none.
    if(d.speech) document.body.classList.add("speech");
  }catch(e){ /* offline is fine; server will error clearly on send */ }
}

// Follow the stream only while the user is parked at the bottom. As soon as they scroll
// up to read something mid-generation, stop yanking the view down; scrolling back to the
// bottom resumes following.
let stick = true, lastTop = 0;
convo.addEventListener("scroll", () => {
  const top = convo.scrollTop;
  const atBottom = top + convo.clientHeight >= convo.scrollHeight - 80;
  // Direction, not just position: the moment the user pushes the view UP we let
  // go and stop following, even if still near the bottom. We only re-follow once
  // they've come back down to the bottom. Programmatic scrolls only ever move
  // DOWN, so they can never trip the "user scrolled up" branch and yank the view.
  if(top < lastTop - 2) stick = false;
  else if(atBottom) stick = true;
  lastTop = top;
});
function scrollDown(){ if(stick){ convo.scrollTop = convo.scrollHeight; lastTop = convo.scrollTop; } }
function stickToBottom(){ stick = true; convo.scrollTop = convo.scrollHeight; lastTop = convo.scrollTop; }

function addCopyBar(ansEl, text){
  const bar=document.createElement("div"); bar.className="answerbar";
  const b=document.createElement("button"); b.textContent="Copy";
  b.onclick=()=>{ navigator.clipboard.writeText(text); b.textContent="Copied ✓";
                  setTimeout(()=>b.textContent="Copy",1200); };
  bar.appendChild(b);
  ansEl.appendChild(bar);
  addSpeakButtons(ansEl, bar, text);   // needs the bar in place to sit at the end of it
}

// A turn replayed from this tab's store: question + answer, no trace. The reasoning
// steps are deliberately not stored — the server discards that bulk after each turn
// too (commit_turn), so what the page shows matches what the model still remembers.
function renderSaved(q, a){
  const t=document.createElement("div"); t.className="turn";
  const u=document.createElement("div"); u.className="user"; u.textContent=q;
  const ed=document.createElement("button"); ed.className="edit"; ed.textContent="✎ edit";
  ed.title="Put this question back in the box to reword and ask again";
  ed.onclick=()=>reAsk(q);
  u.appendChild(ed);
  const ans=document.createElement("div"); ans.className="answer";
  ans.innerHTML=markdown(a); addCopyBar(ans, a);
  t.appendChild(u); t.appendChild(ans); turns.appendChild(t);
}

// ---- one Q/A turn ----
function newTurn(question){
  const t = document.createElement("div"); t.className="turn";
  const u = document.createElement("div"); u.className="user"; u.textContent=question;
  const ed = document.createElement("button"); ed.className="edit"; ed.textContent="✎ edit";
  ed.title="Put this question back in the box to reword and ask again";
  ed.onclick=()=>reAsk(question);
  u.appendChild(ed);
  const trace = document.createElement("details"); trace.className="trace"; trace.open=false;
  const sum = document.createElement("summary"); sum.innerHTML='<span class="spin">◐</span> thinking…';
  const body = document.createElement("div"); body.className="tracebody";
  trace.appendChild(sum); trace.appendChild(body);
  const ans = document.createElement("div"); ans.className="answer";
  const stream = document.createElement("div"); stream.className="stream"; ans.appendChild(stream);
  t.appendChild(u); t.appendChild(trace); t.appendChild(ans);
  turns.appendChild(t); scrollDown();
  return {t, trace, sum, body, ans, stream,
          stepEl:null, thinkEl:null, srcEl:null, stepBuf:"", loadTimer:null,
          answering:false, ansLive:null, lastStep:null};
}

function setStatus(ctx, label){   // live one-line status shown while the model works
  if(!ctx.answering) ctx.sum.innerHTML = '<span class="spin">◐</span> ' + label;
}
// Reasoning before any search is the model working out what to look for; reasoning
// after one is it working out what to say. The engine sends the same "thinking" event
// for both, so the difference is whether a tool has run yet in this turn. If it decides
// to search again the next tool_call resets the line, so this can't be stuck wrongly.
const thinkLabel = ctx => ctx.searched ? "finalising the answer…" : "thinking…";
function setDone(ctx, ok=true){
  ctx.sum.innerHTML = ok ? "✓ reasoning &amp; sources (click to expand)" : "✗ trace";
  ctx.trace.open = false;
}

// An interim answer that turned out to be a lead-in to more research must NOT be
// destroyed — the model may have written good, correct prose before deciding to
// verify. Instead of deleting it, tuck the rendered draft into the trace so it's
// still on the page (collapsed), and nothing the model wrote is ever lost.
function parkDraft(ctx){
  const live = ctx.ansLive; ctx.ansLive = null;
  if(!live) return;
  if(!live.innerHTML.trim()){ live.remove(); return; }   // nothing worth keeping
  const d = document.createElement("div"); d.className = "step draft";
  d.innerHTML = '<span class="steplabel">earlier draft · revised after more research</span>';
  live.classList.add("answer");        // keep the markdown styling once moved out of .ans
  d.appendChild(live);                 // relocate the existing node (detaches it from .ans)
  (ctx.stepEl || ctx.body).appendChild(d);
}

// ---- consume the SSE stream ----
// warmup: the Say Hi! button. Its "Hi" only loads the model, so it must not name the
// tab — warming every dictation session that way left a row of tabs all called "Hi".
async function ask(question, retried=false, warmup=false){
  const model = $("#model").value, effort = $("#effort").value;
  liveQuestion = question;   // so Stop can hand the text back for editing
  if(!warmup) nameThread(question);   // label the tab now, not when the answer lands
  speakStop();               // a new run supersedes whatever is still being read out
  const ctx = newTurn(question);
  // Send is locked during a run, but the textarea stays enabled so the user can
  // draft the next question while the model is still answering.
  sendMode("stop"); runStarted=performance.now();
  controller = new AbortController();
  let finalText = "";
  try{
    const resp = await fetch("/api/ask",{
      method:"POST", headers:{"Content-Type":"application/json"},
      // `restore` lets the server rebuild this session if it has never heard of the
      // sid — after a server restart (or after the session cache dropped this sid) the
      // tab still shows the conversation, so the model must get it back too or the
      // next follow-up answers out of nowhere.
      body: JSON.stringify({q:question, model, effort, sid, tab: tabId,
                            temp: Number($("#temp").value), restore: store.turns}),
      signal: controller.signal,
    });
    if(resp.status === 409){
      // Another live tab owns this conversation (this one is its duplicate, and asked
      // before the first heartbeat could say so). Take a thread of our own and ask again.
      const d = await resp.json().catch(()=>({}));
      ctx.t.remove();
      if(d.sid_taken && !retried){ rotateSid(); return await ask(question, true, warmup); }
      $("#q").value = question; autosize($("#q"));
      flashHint("⚠ "+(d.error || "refused")+" — your question is back in the box");
      return;
    }
    const reader = resp.body.getReader(); const dec = new TextDecoder();
    let buf="";
    while(true){
      const {value,done} = await reader.read(); if(done) break;
      buf += dec.decode(value,{stream:true});
      let i;
      while((i = buf.indexOf("\n\n")) >= 0){
        const frame = buf.slice(0,i); buf = buf.slice(i+2);
        if(!frame.startsWith("data:")) continue;
        const ev = JSON.parse(frame.slice(5).trim());
        finalText = handle(ctx, ev) ?? finalText;
        scrollDown();
      }
    }
  }catch(e){
    if(e.name!=="AbortError"){ ctx.stream.textContent = "connection error: "+e.message; }
  }finally{
    clearLoad(ctx);
    if(finalText) rememberTurn(question, finalText);   // survive reload / other tabs
    sendMode("send"); runEnded=performance.now();
    controller=null; $("#q").focus();
    refreshState();    // answering may have pulled the model in — say so straight away
  }
}

function clearLoad(ctx){   // cancel the pending "loading model…" status once anything arrives
  if(ctx.loadTimer){ clearTimeout(ctx.loadTimer); ctx.loadTimer=null; }
}
function handle(ctx, ev){
  clearLoad(ctx);
  switch(ev.type){
    case "step":{
      // A prior step may have begun an answer that turned out to be more research.
      // Park that draft in the trace (don't delete it) before opening the new step.
      parkDraft(ctx);
      const s=document.createElement("div"); s.className="step";
      // A step whose every tool call failed (dead link, PDF, consent wall) is refunded
      // server-side, so the same number comes round again — label it a retry rather
      // than showing two blocks that both claim to be "step 3".
      const retry = ctx.lastStep!=null && ev.n<=ctx.lastStep;
      ctx.lastStep = ev.n;
      s.innerHTML=`<span class="steplabel">step ${ev.n}${ev.max?" of "+ev.max:""}`
                + `${retry?' · retry (last source gave nothing)':''}</span>`;
      const th=document.createElement("div"); th.className="think"; s.appendChild(th);
      ctx.body.appendChild(s); ctx.stepEl=s; ctx.thinkEl=th; ctx.stepBuf="";
      ctx.answering=false;
      setStatus(ctx, "thinking…");
      // On the first step, the gap before any token is usually the model loading
      // into RAM (~30s cold). Say so in the status if nothing arrives shortly.
      if(ev.n===1){
        ctx.loadTimer = setTimeout(()=>setStatus(ctx, "loading "+$("#model").value+" into memory (~30s, just once)…"), 1200);
      }
      break;
    }
    case "thinking":
      if(ctx.thinkEl) ctx.thinkEl.textContent += ev.text;
      setStatus(ctx, "thinking…"); break;
    case "answer_chunk":{
      ctx.stepBuf += ev.text;
      if(!ctx.answering){
        const lead = ctx.stepBuf.replace(/^\s+/,"");
        // A tool call is pure JSON starting with "{"; a real answer is prose.
        // The moment real answer text begins: fold the research trace and render
        // in the normal (bright) answer color — so there's no jump at the end.
        if(lead && lead[0] !== "{"){
          ctx.answering = true;
          setDone(ctx, true);                 // mark the trace done (stays collapsed)
          ctx.ansLive = document.createElement("div");
          ctx.ans.insertBefore(ctx.ansLive, ctx.stream);
        }
      }
      // Strip gpt-oss's 【2†L1-L4】 citation tokens from the live view; the final
      // event re-renders from server-side-cleaned text anyway (incl. de-TeXed math).
      if(ctx.answering) ctx.ansLive.innerHTML = markdown(ctx.stepBuf.replace(/【[^】]*】/g,""));
      // else: still a forming tool call — not shown; the status line covers it.
      break;
    }
    case "tool_call":{
      // that streamed content was a lead-in to a tool call, not the final answer.
      // Keep whatever prose already rendered (park it in the trace), then continue.
      parkDraft(ctx);
      ctx.stepBuf=""; ctx.answering=false;
      setStatus(ctx, (ev.tool==="web_fetch"?"reading a page":"searching")+(ev.label?" · "+ev.label:"")+"…");
      const c=document.createElement("span"); c.className="chip tool";
      c.textContent = `⚙ ${ev.tool}(${ev.label||""})`;
      (ctx.stepEl||ctx.body).appendChild(c); break;
    }
    case "observation":{
      const c=document.createElement("span"); c.className="chip"+(ev.ok?"":" err");
      c.textContent = (ev.ok?"✓ ":"✗ ")+ev.preview;
      (ctx.stepEl||ctx.body).appendChild(c); break;
    }
    case "source":{
      if(!ctx.srcEl){ ctx.srcEl=document.createElement("div"); ctx.srcEl.className="src";
        ctx.srcEl.innerHTML='<span class="steplabel">sources read</span><br>'; ctx.body.appendChild(ctx.srcEl); }
      const a=document.createElement("a"); a.href=ev.url; a.target="_blank"; a.rel="noopener";
      a.textContent="• "+ev.url; a.style.display="block"; ctx.srcEl.appendChild(a); break;
    }
    case "wait":{
      // Another tab's answer is running on this model. Its turn has to finish first —
      // two conversations sharing the model's one slot is what wrecked both answers.
      setStatus(ctx, "⏳ "+ev.text); break;
    }
    case "notice":{
      const c=document.createElement("span"); c.className="chip warn"; c.textContent="⤴ "+ev.text;
      (ctx.stepEl||ctx.body).appendChild(c); break;
    }
    case "final":{
      ctx.ans.innerHTML = markdown(ev.text);
      addCopyBar(ctx.ans, ev.text);
      setDone(ctx,true); return ev.text;
    }
    case "error":
      ctx.stream.textContent = "⚠ "+ev.text; setDone(ctx,false); break;
    case "done":
      if(ctx.sum.querySelector(".spin")) setDone(ctx,true); break;
  }
}

// ---- wiring ----
const hintEl=$("#hint"), hintDefault=hintEl.textContent; let hintTimer=null;
// A flashed hint falls back to `hintBase`, not always the default line: while something
// long is running (a model load) the status there must survive a passing message.
let hintBase = hintDefault;
function flashHint(msg){
  hintEl.textContent=msg;
  clearTimeout(hintTimer); hintTimer=setTimeout(()=>hintEl.textContent=hintBase, 2000);
}
// Same line, but it stays put — for work that outlasts flashHint's 2s (a cold model
// load runs ~30s, minutes for the biggest). Call holdHint(null) to end it.
function holdHint(msg){
  hintBase = msg || hintDefault;
  clearTimeout(hintTimer); hintEl.textContent = hintBase;
}

// ---- confirm sheet ----
// Resolves true on OK, false on Cancel / Esc / clicking the backdrop.
const modal=$("#modal"); let modalDone=null;
function confirmSheet(title, bodyHTML){
  $("#modaltitle").textContent=title; $("#modaltext").innerHTML=bodyHTML;
  modal.hidden=false; $("#modalok").focus();
  return new Promise(res => modalDone = res);
}
function closeSheet(v){ modal.hidden=true; const f=modalDone; modalDone=null; if(f) f(v); }
$("#modalcancel").onclick=()=>closeSheet(false);
$("#modalok").onclick=()=>closeSheet(true);
modal.addEventListener("click", e=>{ if(e.target===modal) closeSheet(false); });   // backdrop
addEventListener("keydown", e=>{
  if(modal.hidden) return;
  if(e.key==="Escape"){ e.preventDefault(); closeSheet(false); }
  if(e.key==="Enter"){ e.preventDefault(); closeSheet(true); }
});

// ---- temperature ----
// A per-request sampling knob, so it costs nothing to change: unlike num_ctx it does
// not evict the loaded model (measured: load_duration flat across 0.2/1.0/1.8). The
// default is Balanced (0.6), kong's pick. OpenAI recommends 1.0 for gpt-oss, and 0.4
// is what produced the repeated-thinking, re-search-the-same-page behaviour the loop
// detector catches — so if that comes back at 0.6, Creative is the step to try.
// Kept in sessionStorage, not localStorage: writing style is a property of a CONVERSATION,
// the same way the transcript is, so a new tab — and New chat — opens at the default
// step rather than inheriting a Precise you picked for one awkward question last week.
// Reloading inside a tab still keeps your pick, because that is the same conversation.
// The model pick is per tab too (MODEL_KEY below): models share the machine now, so two
// tabs can sit on two different models.
const TEMP_KEY="research.temp", TEMP_DEFAULT="0.6";
const tempSel = $("#temp");
function setWritingStyle(v, remember=true){
  tempSel.value = v;
  // Assigning a value no <option> carries leaves the select blank rather than throwing,
  // which is the check: a stale stored entry from the old four-button strip must
  // land on the default step instead of sending temp:NaN to the model.
  if(!tempSel.value) tempSel.value = TEMP_DEFAULT;
  if(remember) try{ sessionStorage.setItem(TEMP_KEY, tempSel.value); }catch(e){}
}
tempSel.onchange = () => setWritingStyle(tempSel.value);
// Restore this tab's pick; an unknown/absent value falls back to the default one.
setWritingStyle((()=>{ try{ return sessionStorage.getItem(TEMP_KEY) || TEMP_DEFAULT; }
                     catch(e){ return TEMP_DEFAULT; } })(), false);
// Sweep the old cross-tab entry, which would otherwise sit in localStorage forever unread.
try{ localStorage.removeItem(TEMP_KEY); }catch(e){}

// Which model answers THIS tab. It used to be one model for every tab, kept in sync
// through localStorage and the heartbeat, because loading a second model always threw
// the first out of RAM. Models now share the machine when they fit, so a tab keeps its
// own pick and other tabs leave it alone.
const MODEL_KEY="research.model";
function keepModel(name){ try{ sessionStorage.setItem(MODEL_KEY, name); }catch(e){} }
// The old cross-tab broadcast entry would otherwise sit in localStorage unread.
try{ localStorage.removeItem("research.active"); }catch(e){}

// ---- switching models: load beside what fits, ask before deactivating anything ----
// A model that fits next to what is already resident just loads — muse-glimmer stays
// up while gpt-oss comes in beside it. Only when the server says something has to go
// (a model too big to share the machine) is that worth a confirm rather than a surprise.
$("#model").addEventListener("change", async () => {
  const sel=$("#model"), next=sel.value, prev=currentModel;
  if(!prev || next===prev) { currentModel = next; keepModel(next); return; }
  if(controller){          // mid-answer: the running turn is using the current model
    sel.value = prev;
    flashHint("⏳ can't switch models while an answer is streaming");
    return;
  }
  let plan = {ok:true, frees:[], resident:false};
  try{
    const r = await fetch("/api/switch",{method:"POST",headers:{"Content-Type":"application/json"},
                                         body:JSON.stringify({to:next, dry:true})});
    if(r.ok) plan = await r.json();
  }catch(e){}
  if(plan.resident){        // already in RAM (another tab loaded it): nothing to wait for
    currentModel = next; keepModel(next); refreshState();
    flashHint("✓ "+next+" is already loaded"); return;
  }
  if(plan.frees && plan.frees.length){
    const names = plan.frees.map(n => `<span class="name">${esc(n)}</span>`).join(", ");
    const ok = await confirmSheet("Switch model?",
      `<p>There isn't room for <span class="name">${esc(next)}</span> beside what is loaded, ` +
      `so this deactivates ${names}, freeing its RAM — in every tab that uses it.</p>` +
      `<p>Loading the new model takes ~30s (longer for the largest ones). ` +
      `Your conversation is kept.</p>`);
    if(!ok){ sel.value = prev; return; }
  }
  sel.disabled=true; switching=true;   // send stays locked until the weights are in RAM
  holdHint("⟳ loading "+next+" into memory — send unlocks when it's ready…");
  try{
    const r = await fetch("/api/switch",{method:"POST",headers:{"Content-Type":"application/json"},
                                         body:JSON.stringify({to:next})});
    if(!r.ok){
      // 409 is the memory door saying no. Carry the server's reason through verbatim:
      // "switch failed" would hide the one fact that matters, which is what's holding
      // the RAM and how much short we are.
      let msg = "HTTP "+r.status;
      try{ msg = (await r.json()).error || msg; }catch(e2){}
      const err = new Error(msg); err.refused = (r.status===409); throw err;
    }
    currentModel = next; keepModel(next);
    holdHint(null); flashHint("✓ "+next+" is loaded and ready");
  }catch(e){
    sel.value = prev;    // the switch failed; the selector must not lie about what's live
    if(e.refused){
      // Pin it: this one is worth reading, and 2s is not long enough to read it in.
      holdHint("⛔ "+e.message);
      setTimeout(()=>holdHint(null), 15000);
    }else{
      holdHint(null); flashHint("⚠ switch failed — staying on "+prev);
    }
  }finally{ sel.disabled=false; switching=false; refreshState(); }
});
// Shell-style command history: Up/Down cycle through prior questions.
const history=[]; let hIdx=0, draft="";
function send(){
  // While an answer is streaming, typing is free but sending is locked: wait for
  // it to finish or press Stop. The drafted text stays in the box either way.
  if(controller){ flashHint("⏳ model is still answering — wait or press Stop, your draft is kept"); return; }
  // Same during a model switch. A 120B takes ~30s to load and a bigger one minutes,
  // and the server only calls the new model active once the weights are actually in.
  // Without this the question would be sent to a model that isn't loaded yet, get
  // refused as stale, and bounce back into the box looking like "send is broken".
  if(switching){ flashHint("⏳ still loading "+$("#model").value+" — your draft is kept"); return; }
  const q=$("#q").value.trim(); if(!q) return;
  if(history[history.length-1]!==q) history.push(q);  // no consecutive dupes
  hIdx=history.length; draft="";
  $("#q").value=""; autosize($("#q")); stick=true; ask(q);
}
// Grow with the text, but never below the two-row resting height (--qmin).
const QMIN = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--qmin")) || 74;
function autosize(el){
  el.style.height = QMIN + "px";
  const need = Math.max(el.scrollHeight, QMIN);
  el.style.height = Math.min(need, 180) + "px";
  // Only scroll once the box has hit its ceiling; otherwise a stray scrollbar
  // appears inside a box that is already tall enough for its text.
  el.style.overflowY = need > 180 ? "auto" : "hidden";
}
// Pull a question back into the composer to reword and ask again — from the ✎ button
// on any past question, and automatically on Stop, since stopping nearly always means
// "that came out wrong" and the very next thing you want is the text back to edit.
function reAsk(text){
  const el=$("#q"), cur=el.value.trim();
  if(cur && cur!==text.trim()){   // never clobber a draft the user is in the middle of
    flashHint("✎ your draft is still in the box — clear it first"); return;
  }
  el.value=text; autosize(el); el.focus();
  el.setSelectionRange(el.value.length, el.value.length);  // caret at end, ready to edit
}
// One button, two jobs: Send at rest, Stop while an answer streams. Merged so the
// primary button is never a dead disabled control — its click always does the one
// thing that makes sense right now.
function sendMode(mode){
  const b=$("#send"), stopping = mode==="stop";
  b.classList.toggle("stopping", stopping);
  b.textContent = stopping ? "" : "⏎";   // stop is drawn by CSS; send is the return sign
  b.title = stopping ? "Stop the answer — your question comes back to edit"
                     : "Send — or press Enter";
}
// Double-click protection, both directions. The same button sends and stops, so
// the second click of a double-click always lands in the OPPOSITE mode: right
// after Send it would stop the barely-started run; right after Stop (which puts
// the question back in the box) it would instantly re-send it. Both are echoes
// of the first click, not decisions — a real change of heart takes longer.
let runStarted=0, runEnded=0;
$("#send").onclick=()=>{
  if(controller){
    if(performance.now()-runStarted<400) return;
    const q=liveQuestion;    // read before abort(), which clears the run state
    controller.abort(); speakStop();
    if(q) reAsk(q);
    return;
  }
  if(performance.now()-runEnded<400) return;
  send();
};
$("#newchat").onclick=()=>{
  // Abort any run in flight: otherwise it keeps generating into the (now cleared)
  // page and holds Send locked until it finishes on its own.
  if(controller) controller.abort();
  speakStop();
  store={sid:crypto.randomUUID(), turns:[]}; sid=store.sid; saveStore();
  applyTitle();   // back to the app name until the next question names this thread
  setWritingStyle(TEMP_DEFAULT);   // a new conversation starts from the default step
  setEffort(EFFORT_DEFAULT);       // ...and the default effort, so the pair always match
  turns.innerHTML=""; $("#q").focus(); };
$("#sayhi").onclick=()=>{ if(controller || switching) return; stick=true; ask("Hi", false, true); };  // warm the model without typing

$("#deactivate").onclick=async()=>{                       // unload the model from RAM on demand
  const m=$("#model").value;
  if(!m || m==="(no models)") return;
  const btn=$("#deactivate"), old=btn.textContent;
  btn.disabled=true; btn.textContent="Unloading…";
  try{
    const r=await fetch("/api/unload",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({model:m})});
    btn.textContent = r.ok ? "Unloaded ✓" : (r.status===409 ? "In use" : "Failed");
    if(r.status===409) flashHint("⏳ "+((await r.json().catch(()=>({}))).error || "in use elsewhere"));
  }catch(e){ btn.textContent="Failed"; }
  refreshState();      // the freed RAM should show in the header immediately
  setTimeout(()=>{ btn.textContent=old; btn.disabled=false; }, 1400);
};
$("#q").addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); return; }
  const el=e.target, atStart=el.selectionStart===0 && el.selectionEnd===0,
        atEnd=el.selectionStart===el.value.length && el.selectionEnd===el.value.length;
  // Up recalls older questions — only when caret is at the very start, so
  // multi-line editing (moving up within text) still works normally.
  if(e.key==="ArrowUp" && atStart && history.length){
    e.preventDefault();
    if(hIdx===history.length) draft=el.value;   // stash what you were typing
    hIdx=Math.max(0,hIdx-1);
    el.value=history[hIdx]; autosize(el); el.setSelectionRange(0,0);
  } else if(e.key==="ArrowDown" && atEnd && hIdx<history.length){
    e.preventDefault();
    hIdx++;
    el.value=hIdx===history.length ? draft : history[hIdx];
    autosize(el); const n=el.value.length; el.setSelectionRange(n,n);
  }
});
$("#q").addEventListener("input", e => autosize(e.target));
document.addEventListener("keydown", e => {
  if (e.key !== "/" || e.ctrlKey || e.altKey || e.metaKey) return;
  const t = e.target;
  if (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.isContentEditable) return;
  e.preventDefault();
  $("#q").focus();
});
// ---- tab presence ----
// Tell the server this tab exists, so the workhorse model only keeps its long 45m
// keep-alive while someone is here. On the last tab closing, the server drops it to
// the normal 5m default instead of holding ~65 GB of RAM for nothing. A hidden tab
// still counts as open, so the heartbeat keeps running in the background.
const tabId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
const beat = (path, keepalive) => fetch(path, {method:"POST", keepalive,
  headers:{"Content-Type":"application/json"}, body:JSON.stringify({tab:tabId, sid})}).catch(()=>{});
// The heartbeat also claims this tab's conversation. A duplicated tab learns on its
// first beat — before anything can be asked — that its sid belongs to another tab.
const ping = async () => {
  const r = await beat("/api/ping", false);
  if(!r || !r.ok) return;
  try{ if((await r.json()).sid_taken){ rotateSid(); beat("/api/ping", false); } }catch(e){}
};
ping(); setInterval(ping, 30000);
// pagehide covers close/navigate/mobile better than beforeunload; sendBeacon survives
// the teardown. If the page comes back from the bfcache, re-announce ourselves.
addEventListener("pagehide", () => {
  const body = new Blob([JSON.stringify({tab:tabId})], {type:"application/json"});
  if(!navigator.sendBeacon("/api/bye", body)) beat("/api/bye", true);
});
addEventListener("pageshow", ping);

// ---- what is actually holding this machine's RAM ----
// Ollama is not the whole machine: llama.cpp servers hold memory it cannot see, and a
// model that "fits" against Ollama's view can still take the desktop down. The header
// therefore reports the machine, not one runtime — ours, anyone else's, and what's left.
const GB = b => (b/1073741824).toFixed(1);
// "Qwen3.8-Flash-Next-UD-Q4_K_XL" is a file name, not a model name: the quantisation
// suffix is the longest part of the line and the least useful thing on it. The tooltip
// still carries the full name for when it matters.
const shortName = n => n.replace(/-(UD-)?(Q\d|IQ\d|F16|BF16)[\w.]*$/i, "");
function renderState(s){
  const el = $("#mstate"), sel = $("#model");
  const ours = sel && sel.value;     // this tab's model, not the server's last-used one
  const mine = s.resident.find(m => m.backend === "ollama" && m.name === ours);
  const others = s.resident.filter(m => m !== mine);
  const free = s.available, need = (s.sizes || {})[sel && sel.value] || 0;
  const short = need && free < need + s.reserve;      // the selected model wouldn't fit
  // Order is truncation order: on a narrow header the tail is what gets clipped, so the
  // two facts you must not lose — our model's state and the memory left — come first.
  const busy = s.busy || [];
  const bits = [`<b>${esc(ours || "—")}</b> ${mine ? GB(mine.bytes)+" GB in RAM" : "not loaded"}`
                + (busy.includes(ours) && !controller ? " (answering in another tab)" : "")];
  bits.push(`<span class="free ${short ? "full" : (free < 12*1073741824 ? "tight" : "")}">`
            + `${GB(free)} GB free</span>`);
  for(const o of others) bits.push(`${esc(shortName(o.name))} ${GB(o.bytes)} GB`
                                    + (busy.includes(o.name) ? " (answering)" : ""));
  el.querySelector(".txt").innerHTML = bits.join(" · ");
  el.classList.toggle("live", !!mine);
  el.classList.toggle("busy", typeof switching !== "undefined" && switching);
  // The one-liner has to abbreviate; the tooltip carries the whole picture.
  el.title = (s.resident.length
      ? "resident:\n" + s.resident.map(m => `  ${m.name} — ${GB(m.bytes)} GB (${m.backend})`).join("\n")
      : "nothing resident")
    + `\n\n${GB(free)} GB available of ${GB(s.total)} GB`
    + (need ? `\n${sel.value} needs ${GB(need)} GB + ${GB(s.reserve)} GB reserve`
              + (short ? " — WILL NOT FIT" : " — fits") : "");
}
async function refreshState(){
  try{
    const r = await fetch("/api/state");
    if(r.ok) renderState(await r.json());
  }catch(e){}   // the header going stale must never break the page
}
refreshState(); setInterval(refreshState, 10000);

// The intelligence selector is three cups; clicking one sets the water line. The
// hidden #effort input carries the value, so ask() reads it exactly as before.
// Effort is a property of the conversation, same as writing style, and remembered the
// same way: per tab in sessionStorage, so a reload keeps it and New chat resets it.
// The two used to disagree — a reload reset effort but kept the style, New chat reset
// the style but kept effort — so after either one the pair no longer matched.
const EFFORT_KEY="research.effort", EFFORT_DEFAULT="medium";
const effortWrap = document.querySelector(".effortpick");
function setEffort(v, remember=true){
  if(!["low","medium","high"].includes(v)) v = EFFORT_DEFAULT;
  $("#effort").value = v;
  effortWrap.dataset.level = v;
  if(remember) try{ sessionStorage.setItem(EFFORT_KEY, v); }catch(e){}
}
document.querySelectorAll(".cup").forEach(b => b.onclick = () => setEffort(b.dataset.level));
setEffort((()=>{ try{ return sessionStorage.getItem(EFFORT_KEY) || EFFORT_DEFAULT; }
               catch(e){ return EFFORT_DEFAULT; } })(), false);
autosize($("#q"));   // settle the box at exactly its resting height, so the first
                     // keystroke can't nudge it by a pixel

// Replay this tab's own conversation. No `storage` listener for SKEY any more: it used
// to mirror finished answers between tabs and follow another tab's New chat, which is
// exactly the coupling that made every tab show one conversation. Each tab now renders
// only what it asked, on its own model.
// The replay itself is fired at the END of this file, once loadModels() has answered:
// a restored answer only gets its speaker button if body.speech is already set, and
// that class arrives with the /api/models handshake.

// ---- dictation: click to start, click to stop, then send it yourself ----
// Two explicit triggers, no voice-activity detection, nothing that starts on its own.
// The transcript lands in the box and is NEVER auto-sent — you read it, fix any
// misheard word, and press Enter. That is the same contract as ✎ edit and Stop:
// nothing puts words in front of the model without you looking at them first.
const mic = $("#mic");
const MIC_MAX_MS = 90000;      // a forgotten recording stops itself, and stays under the body cap
let recorder=null, recStream=null, recChunks=[], recTimer=null, recState="idle";
// The hint line is one slot and a model load may already own it, so put back what was
// there rather than assuming the default line.
let hintBeforeMic = null;
function micHint(msg){
  if(hintBeforeMic===null) hintBeforeMic = hintBase;
  holdHint(msg);
}
function micUnhint(){
  if(hintBeforeMic===null) return;
  holdHint(hintBeforeMic===hintDefault ? null : hintBeforeMic);
  hintBeforeMic = null;
}

function micIdle(){
  recState="idle";
  clearInterval(recTimer); recTimer=null;
  mic.classList.remove("rec","busy"); mic.disabled=false;
  mic.title="Dictate — click to start, click again to stop";
}
// Called on every exit path. Without it Firefox leaves the tab's recording indicator
// lit and the OS still believes something is listening.
function micRelease(){
  if(recStream){ recStream.getTracks().forEach(t=>t.stop()); recStream=null; }
}

async function micStart(){
  if(recState!=="idle") return;
  // Don't show a recording state until permission actually lands — the Firefox
  // doorhanger can sit for ten seconds, and talking into it wastes a sentence.
  recState="asking"; mic.disabled=true; mic.classList.add("busy");
  micHint("waiting for the microphone…");
  try{
    recStream = await navigator.mediaDevices.getUserMedia({audio:{
      channelCount:1, echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
  }catch(e){
    micIdle(); micUnhint();
    flashHint(e.name==="NotAllowedError"  ? "microphone blocked — allow it from the address bar"
            : e.name==="NotFoundError"    ? "no microphone found"
            : e.name==="NotReadableError" ? "microphone is in use by another app"
            : "couldn't start recording ("+e.name+")");
    return;
  }
  recChunks=[];
  const mime=["audio/ogg;codecs=opus","audio/webm;codecs=opus","audio/ogg","audio/webm"]
              .find(t=>MediaRecorder.isTypeSupported(t));
  recorder = new MediaRecorder(recStream, mime?{mimeType:mime}:undefined);
  recorder.ondataavailable = e => { if(e.data.size) recChunks.push(e.data); };
  recorder.onerror = () => { micStop(true); micUnhint(); flashHint("recording failed"); };
  recorder.onstop = micFinished;
  recorder.start();
  recState="recording"; mic.disabled=false; mic.classList.remove("busy");
  mic.classList.add("rec"); mic.title="Click to stop · Esc to discard";
  const t0=Date.now();
  const tick=()=>{
    const s=Math.floor((Date.now()-t0)/1000);   // a stopwatch, not a rounder: 0:01 = one second gone
    micHint("recording "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0")
            +" · click the mic to stop · Esc to discard");
    if(s*1000>=MIC_MAX_MS) micStop();           // a forgotten mic transcribes what it got
  };
  tick(); recTimer=setInterval(tick,1000);
  document.addEventListener("keydown", micEscape);
}

function micStop(cancel){
  if(recState!=="recording") return;
  recState = cancel ? "cancelled" : "working";
  clearInterval(recTimer); recTimer=null;
  document.removeEventListener("keydown", micEscape);
  mic.classList.remove("rec"); mic.classList.add("busy"); mic.disabled=true;
  if(!cancel) micHint("transcribing…");
  // If stop() throws, onstop will never fire — finish by hand, but disarm the handler
  // first so a late event can't run the upload a second time with an empty blob.
  try{ recorder.stop(); }catch(e){ recorder.onstop=null; micFinished(); }
}
function micEscape(e){
  if(e.key!=="Escape") return;
  e.preventDefault(); micStop(true);
  micUnhint(); flashHint("recording discarded");
}

async function micFinished(){
  micRelease();                                  // kill the recording indicator first
  const blob=new Blob(recChunks); recChunks=[];
  const cancelled = recState==="cancelled";
  // "transcribing…" has to stay up until there is something to say instead of it, so
  // the outcome is decided first and only then replaces the held hint.
  let said=null, text=null;
  try{
    if(cancelled) return;
    const wav=await blobToWav(blob);
    if(!wav){ said="didn't catch anything"; return; }
    const r=await fetch("/api/transcribe",{method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify({wav})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ said=d.error||("transcription failed ("+r.status+")"); return; }
    text=(d.text||"").trim();
    if(!text) said="didn't catch anything";
  }catch(e){ said="transcription failed: "+e.message; }
  finally{
    micIdle(); micUnhint();
    if(text) dictate(text); else if(said) flashHint(said);
  }
}

// decodeAudioData resamples to its context's rate for us — hence an OfflineAudioContext
// fixed at 16000, which is the only rate whisper reads. A *live* AudioContext cannot be
// pinned there: Firefox refuses to connect a mic running at a different rate. So there
// is no worklet and no resampler of our own.
async function blobToWav(blob){
  const buf=await new OfflineAudioContext(1,1,16000).decodeAudioData(await blob.arrayBuffer());
  let pcm=buf.getChannelData(0);
  if(buf.numberOfChannels>1){        // decodeAudioData keeps the SOURCE channel count
    const r=buf.getChannelData(1), mixed=new Float32Array(pcm.length);
    for(let i=0;i<pcm.length;i++) mixed[i]=(pcm[i]+r[i])/2;
    pcm=mixed;
  }
  // Too short or too quiet to be speech. Worth catching here: asked to transcribe
  // silence, whisper does not return nothing — it invents a polite "Thank you."
  let sum=0; for(let i=0;i<pcm.length;i++) sum+=pcm[i]*pcm[i];
  if(pcm.length < buf.sampleRate*0.4 || Math.sqrt(sum/(pcm.length||1)) < 0.005) return null;
  return wavBase64(pcm, buf.sampleRate);
}

// A 44-byte RIFF header around 16-bit samples, written by hand — the same spirit as
// this file's markdown renderer, and it saves shipping a library.
function wavBase64(pcm, rate){
  const bytes=new Uint8Array(44+pcm.length*2), dv=new DataView(bytes.buffer);
  const tag=(off,s)=>{ for(let i=0;i<s.length;i++) dv.setUint8(off+i, s.charCodeAt(i)); };
  tag(0,"RIFF");  dv.setUint32(4, 36+pcm.length*2, true);
  tag(8,"WAVEfmt ");
  dv.setUint32(16,16,true); dv.setUint16(20,1,true);
  dv.setUint16(22,1,true);  dv.setUint32(24,rate,true);
  dv.setUint32(28,rate*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
  tag(36,"data"); dv.setUint32(40, pcm.length*2, true);
  for(let i=0;i<pcm.length;i++){
    const s=Math.max(-1,Math.min(1,pcm[i]));
    dv.setInt16(44+i*2, s<0 ? s*0x8000 : s*0x7fff, true);
  }
  let bin="";   // btoa wants a binary string; chunk it so a long clip can't blow the arg limit
  for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
  return btoa(bin);
}

// Append, never replace: typing half a question and dictating the rest is a real way
// to work, and nothing else in this app clobbers what is already in the box.
function dictate(text){
  const el=$("#q"), cur=el.value;
  el.value = cur && !/\s$/.test(cur) ? cur+" "+text : cur+text;
  autosize(el); el.focus();
  el.setSelectionRange(el.value.length, el.value.length);
  flashHint("dictated — read it, then press Enter to send");
}

mic.onclick = () => { recState==="recording" ? micStop() : micStart(); };
addEventListener("pagehide", micRelease);

// ---- speaking: a finished answer, read aloud on demand ----
// Narration, not conversation. The answer is a document — tables, code, links, and
// steps that arrive in bursts across long searches, sometimes retracted when the model
// decides to look something up after all. Reading it as it forms means guessing
// sentence boundaries in half-written markdown and taking back what was already said.
// So nothing here ever sees a partial answer: you press the speaker on a finished one.
// (Streaming speech belongs in the voice application, where audio IS the output.)
const SPEAK_AHEAD = 2;        // sentences synthesised ahead of the one playing
const speak = {
  gen:0,                      // invalidates everything in flight, in one assignment
  pending:[], ready:[],       // text waiting to synthesise · audio waiting to play
  synthing:false, playing:false, audio:null, abortClip:null,
};
let speakOwner = null;        // the button pair of the answer being read, if any

// Abandon everything: what is playing, what is synthesised, what is queued. Bumping
// gen is what makes it safe — the fetch and the <audio> already in flight check it and
// bow out, so there is no window where a late clip starts after you asked for silence.
//
// It deliberately does NOT clear speak.playing. That flag belongs to the pump below,
// which is still unwinding; clearing it here would let a second pump start alongside
// the first and play two answers over each other.
function speakStop(){
  speak.gen++;
  speak.pending.length = 0;
  speak.ready.forEach(URL.revokeObjectURL);
  speak.ready.length = 0;
  if(speak.audio){ speak.audio.pause(); speak.audio.src=""; speak.audio=null; }
  // pause() fires neither "ended" nor "error", so the pump would wait on this clip
  // for ever. Release it by hand.
  if(speak.abortClip) speak.abortClip();
  if(speakOwner){ speakMark(speakOwner, false); speakOwner = null; }
}

// Nothing without a letter or digit in it is worth a round trip and a clip: stripping
// a table or a rule can leave a lone "." or "-", which synthesises to a click.
const speakWorthSaying = t => /[a-z0-9]/i.test(t || "");

// Synthesis runs AHEAD of playback rather than in step with it: a sentence takes ~1s to
// synthesise and ~7s to say, so keeping a couple in hand is the difference between
// continuous speech and a pause at every full stop.
//
// Both pumps serve whatever is in the queue NOW; neither is tied to the generation it
// started in. That is what makes stop-then-immediately-start work — the generation is
// checked per item, to throw away a clip that arrived too late, never to end the loop.
// A pump that quit on the generation change would still hold its flag while unwinding,
// and the guard at the top would then turn away the work that replaced it.
async function speakSynthLoop(){
  if(speak.synthing) return;
  speak.synthing = true;
  try{
    while(speak.pending.length){
      if(speak.ready.length >= SPEAK_AHEAD){ await speakSleep(120); continue; }
      const gen = speak.gen;
      const text = speak.pending.shift();
      let url = null;
      try{
        const r = await fetch("/api/speak",{method:"POST",
          headers:{"Content-Type":"application/json"}, body:JSON.stringify({text})});
        if(r.ok) url = URL.createObjectURL(await r.blob());
      }catch(e){ /* one sentence failing must not silence the rest of the answer */ }
      if(gen !== speak.gen){ if(url) URL.revokeObjectURL(url); continue; }
      if(url){ speak.ready.push(url); speakPlayLoop(); }
    }
  }finally{ speak.synthing = false; }
}

async function speakPlayLoop(){
  if(speak.playing) return;
  speak.playing = true;                       // claimed synchronously, before any await
  try{
    // Keep going while sentences are still being synthesised, not just while some are
    // ready — otherwise playback stops at the first gap and never restarts.
    while(speak.ready.length || speak.synthing || speak.pending.length){
      const url = speak.ready.shift();
      if(!url){ await speakSleep(80); continue; }
      const gen = speak.gen;
      try{ await speakClip(url, gen); }
      finally{ URL.revokeObjectURL(url); }
    }
  }finally{ speak.playing = false; }
}

function speakClip(url, gen){
  return new Promise(resolve => {
    if(gen !== speak.gen) return resolve();
    const a = new Audio(url);
    speak.audio = a;
    let over = false;
    const done = () => {
      if(over) return;                       // ended and error can both arrive
      over = true;
      if(speak.audio === a) speak.audio = null;
      if(speak.abortClip === done) speak.abortClip = null;
      resolve();
    };
    speak.abortClip = done;                  // speakStop ends the wait through this
    a.onended = done; a.onerror = done;
    a.play().catch(() => {
      // Autoplay refused: the browser wants a gesture it can attribute. Pressing the
      // speaker IS one, so this is rare — but say so rather than going quietly silent.
      flashHint("the browser blocked audio — click the page, then try again");
      done();
    });
  });
}
const speakSleep = ms => new Promise(r => setTimeout(r, ms));

// Markdown is written to be read with the eyes. Fences, pipes and asterisks have no
// spoken form, and reading a URL aloud character by character is worse than useless.
function speakable(md){
  return (md||"")
    // Code blocks are skipped in silence rather than announced: they are on the screen
    // in front of you, and "bash r m dash r f slash tmp" is not speech.
    .replace(/```[\s\S]*?```/g, "\n\n")
    .replace(/`([^`]*)`/g, "$1")
    .replace(/!\[[^\]]*\]\([^)]*\)/g, " ")        // images
    .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")      // links: keep the words, drop the URL
    // A table row is unreadable as written — but only the pipes are. The words in the
    // cells are the answer, so speak them: drop the |---|---| rule, and read every other
    // row as its cells in order, separated by commas. The header row goes first and
    // names the columns once, which is what makes the rows after it make sense. Ending
    // each row with a full stop hands speakSplit a clean break, so one row is one clip.
    .replace(/^[ \t]*\|(.+)\|[ \t]*$/gm, (_, row) =>
      /^[\s|:-]+$/.test(row) ? " "
        : row.split("|").map(c => c.trim().replace(/[.,;:]+$/, "")).filter(Boolean).join(", ") + ".")
    .replace(/^\s*[-=*_]{3,}\s*$/gm, " ")         // horizontal rules
    .replace(/^\s{0,3}#{1,6}\s+/gm, "")           // headings
    .replace(/^\s*>\s?/gm, "")                    // block quotes
    .replace(/^\s*[-*+]\s+/gm, "")                // bullets
    .replace(/^\s*\d+[.)]\s+/gm, "")              // numbered items
    .replace(/\*\*([^*]+)\*\*/g, "$1").replace(/__([^_]+)__/g, "$1")
    .replace(/\*([^*]+)\*/g, "$1").replace(/_([^_]+)_/g, "$1")
    .replace(/【[^】]*】/g, "")                    // gpt-oss's citation tokens
    .replace(/https?:\/\/\S+/g, " link ")
    .replace(/[ \t]+/g, " ")
    .replace(/ +([.,;:!?])/g, "$1")               // the gap a stripped citation leaves
    .trim();
}

// Split for synthesis, not for grammar: a sentence ends at .!?… followed by whitespace.
// Requiring the whitespace is what keeps "3.5 TOPS" and "gpt-oss:120b" in one piece;
// the abbreviation list catches the handful that would otherwise split mid-thought.
// Over-splitting only costs a pause between clips, so this errs toward smaller pieces —
// they synthesise sooner and the first word lands sooner.
const ABBREV = /\b(?:e\.g|i\.e|etc|vs|approx|Dr|Mr|Mrs|Ms|Prof|Fig|No|St|Jr|Sr)\.$/i;
function speakSplit(text){
  const out = []; let start = 0;
  const re = /[.!?…]+["')\]]?(?=\s)|\n{2,}/g;
  let m;
  while((m = re.exec(text))){
    const end = m.index + m[0].length;
    const piece = text.slice(start, end);
    if(ABBREV.test(piece.trimEnd())) continue;   // not a sentence end after all
    if(piece.trim()) out.push(piece.trim());
    start = end;
  }
  const rest = text.slice(start).trim();
  if(rest) out.push(rest);                       // a last line with no closing full stop
  return out;
}

// ---- the speaker buttons ----
const SPEAKER_SVG =
  '<svg viewBox="0 0 24 24" aria-hidden="true">'
  + '<path d="M4 9.5v5a1 1 0 0 0 1 1h2.6l4.1 3.3a1 1 0 0 0 1.6-.8V5a1 1 0 0 0-1.6-.8L7.6 7.5H5a1 1 0 0 0-1 1z"/>'
  + '<path d="M16.4 8.8a4.5 4.5 0 0 1 0 6.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
  + '<path d="M18.9 6.1a8 8 0 0 1 0 11.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
  + "</svg>";

function speakMark(pair, on){
  pair.forEach(b => {
    b.classList.toggle("talking", on);
    b.title = on ? "Stop reading" : "Read this answer aloud";
    b.setAttribute("aria-label", b.title);
  });
}

// One control per answer, drawn twice: level with the first line, and again at the end
// beside Copy. A long answer should not have to be scrolled back to the top to start
// it, nor to the bottom to stop it — so both light up and both stop it.
function addSpeakButtons(ansEl, bar, text){
  if(!document.body.classList.contains("speech")) return;
  const pair = [];
  const make = extra => {
    const b = document.createElement("button");
    b.className = "speakbtn" + (extra ? " " + extra : "");
    b.innerHTML = SPEAKER_SVG;
    b.onclick = () => {
      const mine = speakOwner === pair;
      speakStop();               // silences anything else, and clears its mark
      if(mine) return;           // pressing the one that is talking just stops it
      speakOwner = pair; speakMark(pair, true);
      speakAnswer(text).finally(() => {
        if(speakOwner === pair){ speakMark(pair, false); speakOwner = null; }
      });
    };
    pair.push(b);
    return b;
  };
  ansEl.insertBefore(make("top"), ansEl.firstChild);
  bar.appendChild(make());
  speakMark(pair, false);        // sets the title and aria-label
}

// Say a whole finished answer, in order. Resolves when it has finished OR when
// something else takes the voice (speakStop bumps the generation).
async function speakAnswer(text){
  const gen = speak.gen;
  speakSplit(speakable(text)).forEach(p => { if(speakWorthSaying(p)) speak.pending.push(p); });
  speakSynthLoop(); speakPlayLoop();
  while(gen === speak.gen && (speak.playing || speak.synthing || speak.pending.length))
    await speakSleep(150);
}

addEventListener("pagehide", speakStop);

// Replay the stored conversation only after the handshake has landed. Two reasons it
// has to happen here rather than where the comment above sits: body.speech is set by
// loadModels(), so an earlier replay draws every restored answer without its speaker
// button; and SPEAKER_SVG is a const declared further up this file, so a replay during
// top-level evaluation would sit in its temporal dead zone. loadModels() swallows its
// own errors, so the conversation still comes back with the server down.
loadModels().then(() => { store.turns.forEach(t => renderSaved(t.q, t.a)); stickToBottom(); });
$("#q").focus();
</script>
</body>
</html>
